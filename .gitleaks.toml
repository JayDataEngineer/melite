# gitleaks configuration — custom allowlists and rules
# https://github.com/gitleaks/gitleaks

[allowlist]
  description = "Global allowlist"
  paths = [
    '''(.*?)(jpg|gif|doc|pdf|bin|svg|socket|png|md|lock|sum)''',
    '''go\.sum$''',
  ]

[[rules]]
  id = "llm-keystore-key"
  description = "LLM keystore symmetric key"
  regex = '''[A-Za-z0-9+/]{32,}={0,2}'''
  tags = ["key", "llm"]
  # The entropy heuristic also matches long slash-bearing paths. These
  # files hold coverage tables (per-file glob keys) and workspace
  # manifests (repository.directory fields) — path data, never keys.
  # Scoped to THIS rule only; the keyword rules below stay armed on
  # every file.
  [[rules.allowlists]]
    description = "coverage tables and workspace manifests carry paths, not keys"
    paths = [
      '''scripts/coverage-baseline\.ts''',
      '''tests/walls/ts/suites/coverage-baseline-ratchet\.spec\.ts''',
      '''(^|/)package\.json$''',
    ]

[[rules]]
  id = "api-key-generic"
  description = "Generic API key"
  regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key|access[_-]?key|auth[_-]?token)\s*[:=]\s*['"]?([A-Za-z0-9\-_]{20,})['"]?'''
  tags = ["key", "api"]

[[rules]]
  id = "private-key"
  description = "Private key block"
  regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
  tags = ["key", "private"]

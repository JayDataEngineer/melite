# pytest root config (moved out of the python project's pyproject.toml
# in the 2026-09-08 estate reorg: the test plane belongs to the REPO
# ROOT, the uv project lives at infra/python/). pytest discovers this
# file upward from the invocation dir, so rootdir stays the repo root
# and testpaths resolve here.
#
# tests/ layout: unit/ = no server, routes/ = live gateway (skips when
# down), integration/ = real inference (-m gpu, deselected by default),
# walls/ = the pytest-side orchestrator (test_walls.py) + suites/ (a
# mix of native pytest tests and script-style wall suites; conftest.py
# keeps the unconverted script-style suites OUT of collection),
# dev_dsh/ = the DSH harness gate ladder (own runner), timeline/ = the
# h3 timeline suite (own runner). The goldens live in golden_http/ +
# golden_compose/.
#
# Runner shapes (base env = infra/python/.venv):
#   infra/python/.venv/bin/python -m pytest        # sequential (safe default)
#   infra/python/.venv/bin/python -m pytest -n auto  # parallel across cores
#   python3 tools/run_walls.py                     # the wall battery driver

[pytest]
testpaths = tests/unit tests/routes tests/integration tests/walls
# repo root on sys.path: unit suites import shared factories across
# test files (tests.unit.runtime.conftest) — namespace packages
# resolve only with the root importable.
pythonpath = .
markers =
    gpu: real inference through the queue (opt in: pytest -m gpu)
    xdist_group(name): group tests so they run on the same xdist worker (pytest-xdist --dist=loadgroup)
# -m 'not gpu' deselects the GPU suite by default (GPU money, opt in
# explicitly). `-q` keeps the fast-runner output terse. Parallelism
# is OPT-IN (see above): the walls' subprocess walls ALREADY fork
# their own processes and the integration suite is serial by GPU law.
addopts = -m 'not gpu' -q

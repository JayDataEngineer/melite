# NOTE: absolute paths below are machine-pinned. After a fresh clone run
# scripts/regen-profile-paths.mjs to repin them to your checkout.
# profile-melite-test/cordis.patch.yml — THE DEV LANE COMPOSITION (hand-maintained).
# Migrated to the 0.2.0-rc.1 train 2026-09-28 (operator: "dev rides the
# latest RC, not old cruft"): the 0.1.7-rc.2 pnpm overrides are GONE; this
# profile now installs and runs the same harness train as prod. The melite
# series still rides as link: deps into the inference.cpp tree (dev = live
# extension development), and every melite surface owns its existence row
# via its bundle — this patch CONFIGURES rows by id only.
#
# Preserved lore (do not lose):
# - THE RUNS ROOT PIN: melite-estate takes repoRoot and PINS the queue's
#   state tree — the queue seat refuses to mount unpinned. Without it the
#   bench/runs/drafts seats never compose: every queue door answers "no
#   seat on this lane".
# - THE HOT DOOR: patchReload "live" is the custom-profile default, so dsh
#   watches this file; an insert row names a plugin file by path and the
#   loader mounts/disposes it in the RUNNING lane — no restart.
# - DEFAULT = SPACE BUNNY: the zai account went out of credit once (429
#   "Insufficient balance" surfaced as PI_AI_ERROR empty responses); a
#   default that cannot answer breaks every fallback turn.
# - Retries: every provider declares retryPolicy (the 0.2.0 regression —
#   retries are opt-in; without a policy every upstream flap is an instant
#   failed turn). Same invariant as prod, same reasons.

- insert:
    - id: hot-g2-door
      name: /home/user/Documents/programs/active/inference.cpp/packages/web/melite-estate/hot/g2-maker-door.plugin.ts

# THE TWIN CURE (2026-10-12): the profile stopped bundling
# @melite/harness-provisioner. Its patch inserted an `infer-estate`
# row (name '@melite-plugin/melite-estate' — the SAME package this
# profile already mounts through the dsh-estate bundle's own
# `melite-estate` row above). Two rows, one package: the second
# mount's `new ModelsService` refused ("service models has been
# registered"), the estate entry went INACTIVE, and the lane served
# with an empty models table — every form-spec model refused. The
# profile carried both bundles from 2026-09-29 but never cold-booted
# until the 2026-10-11 re-ship, so the twin lay dormant. Rows the
# provisioner bundle uniquely provided move HERE:
- id: skill-filesystem
  # column-0 override (patches the dsh-base row, mounts nothing):
  # silence the host skill-filesystem row so discovery stays the
  # estate's own surface.
  disabled: true

- insert:
    # the one card studio with no self-patch: @melite/3d-img-to-mesh
    # ships no cordis.patch.yml, so the row lives in the profile.
    # h3-timeline and motion-motion self-register (h3-studio,
    # motion-studio rows in their own bundles).
    - id: card-studio-img-to-mesh
      name: '@melite/3d-img-to-mesh'
    # THE ONE-ROW LAW (operator order, 2026-10-01: "THERE IS ONE WITH
    # SEAMS, LOOK AT HOW DSH DOES UI"): @melite/card-base mounts as the
    # ONE graph row behind every card studio — the mirror of DSH's
    # platform-seed ui atoms (getStaticModules, dsh-client-web
    # /src/seed.ts). The browser graph's dsh.client scan needs this
    # bare-root entry so lib/client.js registers as a module-table row;
    # card clients reach it via dsh.client.external requires (one
    # compiled instance, one css-module hash). No node-side apply —
    # the row exists for the browser graph alone.
    - id: card-studio-atoms
      name: '@melite/card-base'

- id: melite-estate
  config:
    repoRoot: /home/user/Documents/programs/active/inference.cpp/data/runs

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      xiaomi-token-plan-sgp:
        apiKeyEnv: XIAOMI_TOKEN_PLAN_SGP_API_KEY
        # 0.2.0 made retries opt-in per provider (pi-ai hardcodes maxRetries:0
        # and delegates recovery to dsh-llm-retry, which no-ops when the
        # provider declares no policy). PI_AI_ERROR is the fallback code the
        # harness maps "provider returned an empty response" onto — NOT in the
        # default retryable set — so without it here, every upstream flap is an
        # instant failed turn. This block is why bunny flaps get retried.
        retryPolicy:
          mode: normal
          maxRetries: 15
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PI_AI_ERROR]
          backoff: {initialDelayMs: 300, maxDelayMs: 5000, jitterRatio: 0.3}
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        retryPolicy:
          mode: normal
          maxRetries: 15
          retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PI_AI_ERROR]
          backoff: {initialDelayMs: 300, maxDelayMs: 5000, jitterRatio: 0.3}
        models:
          - id: stealth/space-bunny-alpha
            name: Space Bunny
            contextWindow: 1000000
            maxTokens: 524288
            input:
              - text
              - image
            reasoningEfforts:

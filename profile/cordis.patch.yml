- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    # DEFAULT = SPACE BUNNY (2026-09-28). The default was zai/glm-5.3,
    # and the zai account is out of credit: every call returns
    # 429 "Insufficient balance", which pi-ai surfaces to the agent as
    # `PI_AI_ERROR: Provider returned an empty response`. A default that
    # cannot answer breaks every turn that falls back to it, which is
    # how a healthy selected model still looked broken.
    # Verified live: openrouter/stealth/space-bunny-alpha -> HTTP 200.
    provider: openrouter
    model: stealth/space-bunny-alpha
    reasoningEffort: high
- id: agent-loop
  name: "@deepseek-ai/dsh-agent-loop"
  config:
    agents: []
    maxParallelToolCalls: 3

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"

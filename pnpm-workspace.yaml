## @tanstack/react-virtual + virtual-core ship lockfile entries published
## the same day; pnpm's default minimumReleaseAge rejects them.
minimumReleaseAge: 0
## THE PLUGIN WORKSPACE (2026-08-21 law: plugins are REAL packages; the
## package manager materializes every cross-package link per-OS. No
## hand-rolled node_modules links are ever committed; a fresh clone +
## `pnpm install` works on every platform).
##
## ROOT SINCE 2026-09-02: the editor moved OUT of core (web/editor →
## packages/web/editor). It is a CONSUMER — an alternative pathway to the
## dsh plugins, not infrastructure — so it joins as a workspace MEMBER
## like every other plugin (core ships py/ + the contract; nothing else).
## The generic UI kit lives at web/ (THE WEB REGISTRY ruling, 2026-09-03,
## docs/design/web-registry.md §3): first-party design system ABOVE
## pathways — the editor and every engine plugin consume it; no consumer
## hosts shared infrastructure in its subtree.
packages:
  # (2026-09-11: the apps/* product-assembly glob died with the gateway
  # kill — apps/ no longer exists; the estate serves in-process.)
  - 'packages/*/*' # STRUCTURE STAGE 2 (2026-09-08): uniform DSH two-tier — packages/<domain>/<pkg>; mid-tier dirs (harness/dsh, web/dsh) and 1-tier leaves died
  - 'packages/web-kit/*'
    # WEB-KIT (2026-09-11): the @melite/* kit packages are REAL workspace members — the editor
    # consumes them via workspace:* and pnpm owns their peer resolution (the fossil node_modules with react 18
    # under @melite/ui mounted a SECOND React in the editor's vitest and killed every render test).
  - 'vendor/cordis_plugins/*' # VENDORED platform tier (2026-09-08: harness-vendor discipline — loader/timer/logger-console as workspace members, consumed via workspace:*; pnpm materializes the links, no registry copy can exist)
  - 'packages/engines/*/action_cards/*/ui' # engine UI tenants (@melite-plugin/{video,3d,audio,motion})
  - 'packages/engines/*/action_cards/*/*/ui'
    # genre-grouped card lanes
    # (ROW 5, 2026-09-07: @melite-plugin/timeline moved OUT of
    # video/h3-timeline/ui to packages/web-kit/timeline — PRIMITIVE HOME LAW, a
    # cross-genre primitive must not live inside one card's dir.
    # The glob stays for future genre-grouped lanes.)
  - 'packages/engines/*/action_cards' # card tenants (resolution scope; @melite/cards)
  - 'packages/engines/*' # ENGINE DOMAIN (STAGE 1, 2026-09-08): engine leaves (@melite/engine-comfyui first; MCP-as-cards slots beside it — the package root, not action_cards/)

allowBuilds:
  '@parcel/watcher': true
  lefthook: true

## ONE REACT for the whole workspace (web-registry move, 2026-09-03):
## the @melite kit packages declare react:"*" (they render wherever a
## consumer mounts them) — without a pin, pnpm re-resolved the wildcard
## to a SECOND react (18.3.1 beside the editor's 19.2.8) and every
## radix-hook test died on dual-React useRef. The override makes the
## single-instance law explicit.
## NOTE (2026-09-10): the react single-instance override died here —
## it never reached the lockfile (mixed 18.3.1/19.2.8 is the installed
## truth). Re-adding it needs a full lockfile re-resolution, not a line.
## DONE (2026-09-11, coverage stroke): the re-resolution happened —
## packages/web-kit/* enrolled as members (fossil react-18
## node_modules gone), react+react-dom pinned ^19.2.6 in the
## editor-consumed UI pkgs (web-kit ui/slots/timeline,
## action_cards/@melite/cards, six UI genre pkgs). Installed truth
## is single-react-19 for the whole editor graph (hoisted zustand
## default included); the 226-file editor suite is green.

# registry.yaml — the asset-class index (game-kit front matter)
#
# ONE row per asset class the kit produces. Adding a new class = new
# folder + SKILL.md + lane yaml (+ CPU tool if post-processing) + a row
# here + sync.sh glob. Nothing else changes (gateway, families, cards).
#
# seed_families reserve disjoint numeric bands so sets read as families
# and never collide across classes.

classes:
  - class: props          # static 3D props (loot drops, construction)
    folder: props-3d
    generator: gen_lanes.py "--set loot|build" (z-image -> trellis_native -> replay -> views)
    seed_family: 7xxx concept / mesh seed per wave; weapons sub-family
      band 2x (scrap_machete anchor 23, bone_shortsword 24 — shared
      style-suffix family per ART-MANIFEST law 8)
    budget: "<=5000 faces (loot) / <=8000 (build) via trellis_native_replay"
    gate: gamekit-vision-gate turntable + glb_metrics budget check
    output: creatures/props kit categories -> FBX via ingest gate

  - class: creatures       # animated quadrupeds/bipeds
    folder: creatures-forge
    generator: FORGE-PLAYBOOK.md breed loop (anycreature -> z-image -> trellis -> rig bridge)
    seed_family: per-species spec (wolf.json lineage)
    budget: match existing kind models
    gate: agent-eyes turntable + animation parse (idle+move loops, U-027)
    output: creatures kit category -> FBX + kind JSON one-line swap

  - class: humanoids       # player/NPC bodies + races
    folder: races
    generator: race lanes (base + morphs + attachments)
    seed_family: per-race
    budget: n/a
    gate: vision gate + promote taste call
    output: humanoids staging -> promote -> Resources/models

  - class: icons           # UI item icons
    folder: icons-ui
    seed_family: 3xx (machete=301 lineage)
    budget: 512-1024 square
    gate: style-family match by eye (line weight vs shipped set)
    output: icons kit category -> UI/icons

  - class: ground_textures # tileable terrain materials
    folder: ground-textures
    seed_family: 4xx
    budget: 1024 square albedo
    gate: 2x2 tile sheet continuity (make_tiling.py report + vision)
    output: textures kit category (Unity material wiring pending rework)

  - class: sprites_2d      # 2D/2.5D sprite sheets, tilesets, parallax
    folder: sprites-2d
    seed_family: 6xx
    budget: per-sheet grid declared in lane
    gate: pack_sprites.py slice report + vision gate on sheet + frames
    output: sprites kit category (per-frame PNGs + atlas + rows json)

  - class: sfx             # gameplay/ambience sound effects
    folder: sfx
    seed_family: "5xxx (wave-specific bands: 4242 UI, 909 combat, 51xx P2)"
    budget: short captions, one event per call
    gate: by-ear (operator); name EXACTLY as AudioDirector keys
    output: audio/sfx kit category (flac -> ogg on ingest)

  - class: music           # structured tracks
    folder: music
    seed_family: 6xxx
    budget: three-section caption law; draft_short iterate, final_long deliver
    gate: by-ear (operator)
    output: audio/music kit category

  - class: vo              # character voice lines
    folder: vo
    seed_family: 17xx (per-character band)
    budget: CustomVoice preset + locked instruct DNA per character
    gate: by-ear (operator)
    output: audio/vo kit category

  - class: motion          # kimodo motion — DELIVERABLE IS .BVH (operator law 2026-08-29)
    folder: motion
    generator: kimodo_motion family (POST /v1/pipelines/start; prompt+seed+duration)
    seed_family: per-clip (kimodo seed, e.g. s42)
    budget: BVH (Root + SOMA-77 = 78 joints, 30 Hz) converted from the raw npz by
      kimodo's OWN converter (python3 -m kimodo.scripts.motion_convert <npz> <id>.bvh --to soma-bvh)
    gate: npz structural check (posed_joints (T,77,3) + global_rot_mats (T,77,3,3)) THEN
      BVH structural check (78 joints, frames>0, frame time 1/30) in deliver_asset.py
    output: unity Assets/Resources/motion/<id>.bvh (raw npz stays in the run dir as SSOT)
    law: MOTION IS SEPARATE (2026-08-28) — never baked onto meshes. ONE WAY (2026-08-29) —
      kimodo generate -> kimodo motion_convert --to soma-bvh -> deliver .bvh.
      No custom matrix parsing, no Blender, no figure in the motion path.

laws:
  serial_gpu: "one lane at a time via game-kit/serial_runner.py (gotcha #7)"
  gate_everything: "no asset skips its class gate; retries obey retry-once"
  delivery: "bulk via tools/ingest_ray_kit.py (meld repo); manual copying banned"
  seeds: "never reuse a band across classes; document new bands here"
  registry: "game-kit/assets/registry.yaml is THE per-asset versioned SSOT (ADR-ASSET-REGISTRY); write only via scripts/asset_registry.py"
  requests: "new asks enqueue into game-kit/requests/pending via scripts/request_asset.py | POST /v1/assets/requests | MCP meld-assets; claim one-at-a-time"

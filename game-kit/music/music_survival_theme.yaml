# @meta {"description": "Survival theme track - music3 structured caption. draft_short for iteration; swap preset to final_long for delivery.", "status": "production"}
# music_survival_theme.yaml - dark folk ambient theme. Caption is the 90%:
# three sections, Label: text format. Iterate on draft_short only.

output_dir: ./data/test-output/pipelines/pipeline_music_survival_theme

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: audio_music3
    phase: music
    title: "Survival theme (dark folk ambient)"
    consumes: [comfy_url]
    outputs: [theme]
    params:
      model: music3
      preset: draft_short
      output_artifact: theme
      prompt: >-
        Genre: dark folk ambient
        Vocal Details: instrumental, no vocals
        Arrangement: fingerpicked acoustic guitar, low strings pad, distant
        frame drum, reverb-heavy mix, 70 bpm, minor key

# @meta {"description": "Tension loop - music3 sparse percussion bed, 60-90s, seamless loop, engagement-window layer under survival_theme.", "status": "production-candidate"}
# music_tension_loop.yaml - ART-MANIFEST P2. music3 three-section caption law.

output_dir: ./data/test-output/pipelines/pipeline_music_tension_loop

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: audio_music3
    phase: music
    title: "Music - tension loop"
    consumes: [comfy_url]
    outputs: [music_tension_loop]
    params:
      model: music3
      seed: 6100
      preset: final_long
      output_artifact: music_tension_loop
      prompt: >-
        Genre: sparse dark desert ritual percussion, cinematic tension
        Vocal Details: instrumental, no vocals
        Arrangement: dry skin toms and bone clackers over a deep steady
        pulse, sparse negative space, reverb-tight mix, 70 bpm, seamless
        loop, minor key, no melody

# @meta {"description": "Scavenger character VO lines - qwen3-tts CustomVoice (aiden preset) with per-line emotional direction.", "status": "production"}
# vo_scavenger_lines.yaml - character VO. Voice identity = aiden preset +
# locked instruct DNA. NOTE: .qvoice export currently does not emit an
# artifact (open defect 2026-08-25); preset+instruct carries consistency.

output_dir: ./data/test-output/pipelines/pipeline_vo_scavenger_lines

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: audio_tts
    phase: vo
    title: "Line - reunion relief"
    consumes: [comfy_url]
    outputs: [v1]
    params:
      model: qwen3-tts
      seed: 1701
      output_artifact: v1
      qwen3_variant: CustomVoice
      voice: aiden
      instruct: >-
        surprised, warming into relief, quiet affection
      prompt: You actually came back. I thought the dunes took you.

  - family: audio_tts
    phase: vo
    title: "Line - storm warning"
    consumes: [comfy_url]
    outputs: [v2]
    params:
      model: qwen3-tts
      seed: 1702
      output_artifact: v2
      qwen3_variant: CustomVoice
      voice: aiden
      instruct: >-
        tense, low urgent whisper, eyes on the horizon
      prompt: Storm's coming. Whatever dug those bones out of the ridge, it's still hungry.

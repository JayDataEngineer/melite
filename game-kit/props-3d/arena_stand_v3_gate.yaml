# arena_stand_v3_gate — context-free RECOGNISED gate for the v3
# landscape-wedge attempt (run pmtc8v856wcfc72, seed 7312, QEM 4990 tris).
# Strict expects; "chair"/"lounger"/"picnic table"/"table" all BLOCK.
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand_v3_gate

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: input
    phase: gate
    title: "Import front view"
    consumes: [comfy_url]
    outputs: [front]
    params:
      model: input
      source: /editor/assets/runs/pmtc8v856wcfc72/render_glb_views_pmtc8v856wcfc72_render_glb_views_front_mesh.png
      output_artifact: front

  - family: input
    phase: gate
    title: "Import left view"
    consumes: [comfy_url]
    outputs: [left]
    params:
      model: input
      source: /editor/assets/runs/pmtc8v856wcfc72/render_glb_views_pmtc8v856wcfc72_render_glb_views_left_mesh.png
      output_artifact: left

  - family: input
    phase: gate
    title: "Import back view"
    consumes: [comfy_url]
    outputs: [back]
    params:
      model: input
      source: /editor/assets/runs/pmtc8v856wcfc72/render_glb_views_pmtc8v856wcfc72_render_glb_views_back_mesh.png
      output_artifact: back

  - family: blind_read
    phase: gate
    title: "Recognised gate - arena stand v3"
    consumes: [comfy_url]
    inputs: [front, left, back]
    params:
      model: blind_read
      images: [front, left, back]
      expect: [stand, bench, bleacher, seating, grandstand, stairs, stadium, steps]
      fail_on: MISS
      output_artifact: blind_read

# retry-once lane (vision gate: floating debris) — gen_retries.py
output_dir: ./data/test-output/pipelines/pipeline_props_v1r_campfire_lit

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - campfire lit"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 8013
      output_artifact: asset_image
      prompt: >-
        blazing campfire ring of sun-bleached stones, stacked driftwood teepee with bright orange-violet flame and glowing embers, single compact solid object, nothing floating or detached, isolated game prop, centered, plain white background, stylized realistic game asset

  - family: trellis_native
    phase: mesh
    title: "Mesh - campfire lit"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 23
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - campfire lit"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 8000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - campfire lit"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

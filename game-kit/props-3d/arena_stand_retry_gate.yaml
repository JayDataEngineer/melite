# arena_stand_retry_gate — context-free RECOGNISED gate for the v2 retry
# (run pmtc8ouowv4o5l5, seed 7311, QEM 4210 tris). Strict expects: the
# reader must identify tiered public seating; "chair" is a BLOCK (v1 tell).
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand_retry_gate

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: input
    phase: gate
    title: "Import front view"
    consumes: [comfy_url]
    outputs: [front]
    params:
      model: input
      source: /editor/assets/runs/pmtc8ouowv4o5l5/render_glb_views_pmtc8ouowv4o5l5_render_glb_views_front_mesh.png
      output_artifact: front

  - family: input
    phase: gate
    title: "Import left view"
    consumes: [comfy_url]
    outputs: [left]
    params:
      model: input
      source: /editor/assets/runs/pmtc8ouowv4o5l5/render_glb_views_pmtc8ouowv4o5l5_render_glb_views_left_mesh.png
      output_artifact: left

  - family: input
    phase: gate
    title: "Import back view"
    consumes: [comfy_url]
    outputs: [back]
    params:
      model: input
      source: /editor/assets/runs/pmtc8ouowv4o5l5/render_glb_views_pmtc8ouowv4o5l5_render_glb_views_back_mesh.png
      output_artifact: back

  - family: blind_read
    phase: gate
    title: "Recognised gate - arena stand v2"
    consumes: [comfy_url]
    inputs: [front, left, back]
    params:
      model: blind_read
      images: [front, left, back]
      expect: [stand, bench, bleacher, seating, grandstand, stairs, stadium]
      fail_on: MISS
      output_artifact: blind_read

# arena_banner_sweep — corroborating diagnostic sweep of the five
# non-canonical views of run pmtc90ldmr4qzvo (canonical gate = yellow:
# front "Bleachers" / back "a bench" / left "Sun lounger").
# fail_on never — this measures agreement, it does not block.
output_dir: ./data/test-output/pipelines/pipeline_props_arena_banner_sweep

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: input
    phase: gate
    title: "Import right view"
    consumes: [comfy_url]
    outputs: [right]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_right_mesh.png
      output_artifact: right

  - family: input
    phase: gate
    title: "Import front_left view"
    consumes: [comfy_url]
    outputs: [front_left]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_front_left_mesh.png
      output_artifact: front_left

  - family: input
    phase: gate
    title: "Import front_right view"
    consumes: [comfy_url]
    outputs: [front_right]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_front_right_mesh.png
      output_artifact: front_right

  - family: input
    phase: gate
    title: "Import back_left view"
    consumes: [comfy_url]
    outputs: [back_left]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_back_left_mesh.png
      output_artifact: back_left

  - family: input
    phase: gate
    title: "Import back_right view"
    consumes: [comfy_url]
    outputs: [back_right]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_back_right_mesh.png
      output_artifact: back_right

  - family: blind_read
    phase: gate
    title: "Sweep read - five non-canonical views"
    consumes: [comfy_url]
    inputs: [right, front_left, front_right, back_left, back_right]
    params:
      model: blind_read
      images: [right, front_left, front_right, back_left, back_right]
      expect: [stand, bench, bleacher, seating, grandstand, stairs, stadium]
      fail_on: never
      output_artifact: blind_read

# @meta {"description": "Pose-corrected statue: level quadruped wolf (head FORWARD, not howling) -> TRELLIS -> bridge-pair mesh v2.", "status": "production-candidate"}
# stone_wolf_statue_v2.yaml - v1's upright-howl pose read humanoid from
# front/back and fights the quadruped rig. v2 demands a LEVEL four-point
# stance so nearest-bone skinning gets a sane quadruped shape.

output_dir: ./data/test-output/pipelines/pipeline_stone_wolf_statue_v2

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - level-stance stone wolf"
    consumes: [comfy_url]
    inputs: []
    outputs: [asset_image]
    params:
      model: z-image
      seed: 77
      output_artifact: asset_image
      prompt: >-
        Weathered stone wolf statue in strict side profile, horizontal back
        line, standing on exactly four sturdy legs planted on the ground,
        head held FORWARD and slightly low in an alert prowl, mouth closed,
        thick neck, long straight tail extended behind horizontally, cracked
        grey granite with moss patches, full body in frame touching neither
        edge, plain solid mid-grey background, flat even studio lighting
        with no shadows, stylized fantasy game asset, clean sculpted details.
      negative_prompt: >-
        howling, head up, standing on hind legs, bipedal, upright, sitting,
        pedestal, scene, environment, ground plane, person, multiple statues,
        text, watermark, cropped, busy background, drop shadow, vignette,
        photorealistic, blurry, low contrast.

  # -- MESH (native trellis.cpp; torch lane retired 2026-08-26) ----
  - family: trellis_native
    phase: mesh
    title: "Mesh - native (Trellis - static GLB (no rig))"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb_raw]
    params:
      # torch lane retired 2026-08-26 (confetti): preset/background_color/rig_with_somax dropped - the native node
      # enforces the reference defaults (BiRefNet auto matte,
      # QEM 300K @1024, xatlas, trilinear PBR bake).
      model: trellis_native
      seed: 19
      resolution: "1024"
      texture_size: 2048
      bg_removal: auto
      image_artifact: asset_image
      dump_post: enable
      output_artifact: asset_glb_raw

  - family: trellis_native_replay
    phase: budget
    title: "Budget - QEM 60000 faces"
    consumes: [comfy_url]
    inputs: [asset_glb_raw]
    outputs: [asset_glb]
    params:
      model: trellis_native_replay
      faces_target: 60000
      atlas: 2048
      glb_artifact: asset_glb_raw
      dump_artifact: asset_glb_raw_dump
      output_artifact: asset_glb

  - family: render_glb_views
    phase: review
    title: "Turntable renders (feeds agent eyes)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [asset_views]
    params:
      glb_artifact: asset_glb

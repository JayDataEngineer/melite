# arena_stand_gate — context-free RECOGNISED gate (gamekit-vision-gate law)
# for run pmtc8dmrcfjrffv (arena_stand, seed 7301 -> trellis s22 -> QEM 4672 tris).
# Three canonical views (front/left/back) in ONE batch, context-free reader
# (keystore active key, deepseek-v4-flash-vision-exp), retry-on-empty built in
# (3 attempts per view), fail_on MISS. Blank-frame stdev pre-checked: 70.27 /
# 63.92 / 70.98 (all >> 1 — no render defect).
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand_gate

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: input
    phase: gate
    title: "Import front view"
    consumes: [comfy_url]
    outputs: [front]
    params:
      model: input
      source: /editor/assets/runs/pmtc8dmrcfjrffv/render_glb_views_pmtc8dmrcfjrffv_render_glb_views_front_mesh.png
      output_artifact: front

  - family: input
    phase: gate
    title: "Import left view"
    consumes: [comfy_url]
    outputs: [left]
    params:
      model: input
      source: /editor/assets/runs/pmtc8dmrcfjrffv/render_glb_views_pmtc8dmrcfjrffv_render_glb_views_left_mesh.png
      output_artifact: left

  - family: input
    phase: gate
    title: "Import back view"
    consumes: [comfy_url]
    outputs: [back]
    params:
      model: input
      source: /editor/assets/runs/pmtc8dmrcfjrffv/render_glb_views_pmtc8dmrcfjrffv_render_glb_views_back_mesh.png
      output_artifact: back

  - family: blind_read
    phase: gate
    title: "Recognised gate - arena stand"
    consumes: [comfy_url]
    inputs: [front, left, back]
    params:
      model: blind_read
      images: [front, left, back]
      expect: [stand, bench, bleacher, seating, grandstand, stairs]
      fail_on: MISS
      output_artifact: blind_read

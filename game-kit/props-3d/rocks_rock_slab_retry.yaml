# rock_slab retry — v1 (seed 8203) gated RED: views disagreed, amorphous
# crumpled form, no planar read. Rework-once law: bolder proportions
# (thick angular slab, sharp broken edges), fresh concept+mesh seeds.
output_dir: ./data/test-output/pipelines/pipeline_props_rocks_rock_slab_retry

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - rock slab retry"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 8303
      output_artifact: asset_image
      prompt: >-
        single thick flat slab of sandstone leaning at an angle against a low
        stone block, sharp angular broken edges, hard planar faces, sun-bleached
        bone-white surface with ochre strata lines, isolated game prop, centered,
        plain white background, stylized realistic game asset
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        objects, cropped, round shapes, smooth blob

  - family: trellis_native
    phase: mesh
    title: "Mesh - rock slab retry"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 33
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - rock slab retry"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - rock slab retry"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

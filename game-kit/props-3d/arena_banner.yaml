# arena_banner — arena pit mouth banner pole (spec: req-20260827-190320-arena_banner).
# ONE fused pole+banner mesh, cloth hangs straight down, abstract sun-disc
# sigil (NOT a letterform). Budget ≤5k. Seed band 73xx (arena wave).
output_dir: ./data/test-output/pipelines/pipeline_props_arena_banner

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - arena banner"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 7302
      output_artifact: asset_image
      prompt: >-
        tall wooden banner pole with a single hanging cloth banner, the cloth
        hangs straight down flat against the pole, weathered desert cloth
        painted with one simple abstract sun-disc sigil symbol, pole capped
        with a small bone-white finial, desaturated desert-dusk ochre wood,
        bone-white cloth with bruise-violet trim band, pole and banner fused
        as one single solid object, flat level base, taller than wide, bold
        simple silhouette, isolated game prop, centered, plain white
        background, stylized realistic game asset, bold readable silhouette
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        separated objects, cropped, people, figures, letters, alphabet,
        writing, words, flapping wind-blown cloth, thin delicate shapes

  - family: trellis_native
    phase: mesh
    title: "Mesh - arena banner"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - arena banner (QEM 5000, spec <=5k)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - arena banner"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

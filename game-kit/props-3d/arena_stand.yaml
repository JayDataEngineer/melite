# arena_stand — §4.32 T3 arena spectator stand (spec: req-20260827-190319-arena_stand).
# ONE unified carpentered object (rock_slab v1 lesson: multi-object
# compositions confuse TRELLIS). Two-tier plank bench, stubby leg frames,
# desert-dusk ochres / bone-whites / bruise-violet accents. Budget ≤5k
# (instancing-heavy: 4+ stands per arena). Seed band 73xx (arena wave,
# props 7xxx family).
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - arena stand"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 7301
      output_artifact: asset_image
      prompt: >-
        sturdy two-tier spectator bleacher stand, one raised back plank bench
        tier above one lower front plank bench tier, thick chamfered wooden
        planks on stubby blocky leg frames, carpentered scrap-wood
        construction, desaturated desert-dusk ochre planks with bone-white
        seat boards and bruise-violet accent trim, flat level base sitting
        squarely on the ground, low wide silhouette wider than tall, one
        single unified carpentered object, isolated game prop, centered,
        plain white background, stylized realistic game asset, bold readable
        silhouette
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        separated objects, cropped, people, crowd, spectators, figures,
        thin delicate shapes, visible nails, roof, canopy

  - family: trellis_native
    phase: mesh
    title: "Mesh - arena stand"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - arena stand (QEM 5000, spec <=5k)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - arena stand"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

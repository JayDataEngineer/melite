# arena_banner_gate — context-free RECOGNISED gate for run pmtc90ldmr4qzvo
# (arena_banner, seed 7302, QEM 4892 tris, static). Three canonical views,
# one batch, strict expects; "person/figure/totem-pole-only" reads BLOCK.
output_dir: ./data/test-output/pipelines/pipeline_props_arena_banner_gate

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: input
    phase: gate
    title: "Import front view"
    consumes: [comfy_url]
    outputs: [front]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_front_mesh.png
      output_artifact: front

  - family: input
    phase: gate
    title: "Import left view"
    consumes: [comfy_url]
    outputs: [left]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_left_mesh.png
      output_artifact: left

  - family: input
    phase: gate
    title: "Import back view"
    consumes: [comfy_url]
    outputs: [back]
    params:
      model: input
      source: /editor/assets/runs/pmtc90ldmr4qzvo/render_glb_views_pmtc90ldmr4qzvo_render_glb_views_back_mesh.png
      output_artifact: back

  - family: blind_read
    phase: gate
    title: "Recognised gate - arena banner"
    consumes: [comfy_url]
    inputs: [front, left, back]
    params:
      model: blind_read
      images: [front, left, back]
      expect: [flag, banner, flagpole, pole, standard, sign]
      fail_on: MISS
      output_artifact: blind_read

# arena_stand_v3 — ROOT-CAUSE fix after two recognised-gate failures.
# v1 (seed 7301): mesh read "chair" 0/3. v2 (seed 7311): "Bleachers"/"bench"
# canonical 2/3 BUT diagonals read "picnic table" 4/4, flanks "lounger";
# bbox footprint measured 1.00 x 0.98 SQUARE vs spec 3.2 x 1.2 (2.67:1).
# Cause: lane never set image aspect -> portrait 768x1024 concept squashed
# the long stand into a square; TRELLIS faithfully meshed furniture.
# v3 lane change: LANDSCAPE 1024x768 concept + SOLID STEPPED-WEDGE mass
# (rock_slab lesson: one solid single mass, steps ARE the seats) + anti-
# furniture negatives. Seed 7312 (band 73xx). Style suffix identical to the
# arena wave. FINAL attempt before operator requeue.
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand_v3

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - arena stand v3"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 7312
      width: 1024
      height: 768
      output_artifact: asset_image
      prompt: >-
        one long low solid stepped wedge of stacked timber tiers seen from
        the side, three wide stair-step bench tiers rising toward the back,
        each step itself is a long thick plank seat, like a compact stadium
        bleacher carved from thick chamfered planks, solid filled mass under
        the steps with no open void underneath, very long and low, twice as
        long as it is deep, carpentered scrap-wood construction, desaturated
        desert-dusk ochre planks with bone-white seat boards and bruise-violet
        accent trim, flat level base sitting squarely on the ground, one
        single unified carpentered object, isolated game prop, centered,
        plain white background, stylized realistic game asset, bold readable
        silhouette
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        separated objects, cropped, people, crowd, spectators, figures, thin
        delicate shapes, visible nails, roof, canopy, single chair, armchair,
        one seat, throne, stool, picnic table, table, lounger, chaise lounge,
        sun chair, tall narrow, square footprint, legs, open space underneath

  - family: trellis_native
    phase: mesh
    title: "Mesh - arena stand v3"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - arena stand v3 (QEM 5000, spec <=5k)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - arena stand v3"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

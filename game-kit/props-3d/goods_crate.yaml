# goods_crate — market goods crate (spec: req-20260827-190320-goods_crate).
# Lidded desert cargo crate, 0.8m cube, plank-and-bone construction, one
# bruise-violet painted band, flat-bottomed. Budget ≤5k. Seed band 73xx.
output_dir: ./data/test-output/pipelines/pipeline_props_goods_crate

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - goods crate"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 7304
      output_artifact: asset_image
      prompt: >-
        sturdy lidded desert cargo crate, closed wooden box with a fixed
        lid, chunky plank-and-bone construction with bone-white corner
        bracing, one wide bruise-violet painted band around the middle,
        desaturated desert-dusk ochre planks, flat level bottom, compact
        cube proportion, one single unified object, isolated game prop,
        centered, plain white background, stylized realistic game asset,
        bold readable silhouette
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        separated objects, cropped, open crate, contents, bottles, sacks,
        people, figures, thin delicate shapes

  - family: trellis_native
    phase: mesh
    title: "Mesh - goods crate"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - goods crate (QEM 5000, spec <=5k)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - goods crate"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

# @meta {"description": "Static weapon lane: scrap machete concept -> TRELLIS static GLB -> turntable. Agent-eyes gate (blind_read brick retired 2026-08-25).", "status": "production-candidate"}
# scrap_machete.yaml — game-kit-v1 weapon #1. Static-lane copy per
# props-armor-buildings.md. GATE: agent eyes on the turntable (neutral
# factual prompt, retry once; views must agree on ONE subject = "machete"
# / "blade" / "sword"). verify_glb/blind_read bricks intentionally absent
# (retired by operator order 2026-08-25; static floors uncalibrated).

output_dir: ./data/test-output/pipelines/pipeline_scrap_machete

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  # -- CONCEPT ------------------------------------------------------------
  - family: generate_image
    phase: concept
    title: "Concept — scrap machete"
    consumes: [comfy_url]
    inputs: []
    outputs: [asset_image]
    params:
      model: z-image
      seed: 23
      output_artifact: asset_image
      prompt: >-
        Chunky scrap cleaver weapon, very wide thick iron blade with heavy spine,
        nicks and grind marks, sturdy cloth-wrapped handle, small leather guard,
        standing upright full weapon in frame, plain solid mid-grey
        background, flat even studio lighting with no shadows, bold
        readable silhouette, stylized fantasy game asset, clean details.
      negative_prompt: >-
        scene, environment, ground, hand, hands, person, multiple objects,
        text, watermark, cropped, busy background, drop shadow, vignette,
        photorealistic, blurry, low contrast.

  # -- MESH ----------------------------------------------------------------
  # -- MESH (native trellis.cpp; torch lane retired 2026-08-26) ----
  - family: trellis_native
    phase: mesh
    title: "Mesh - native (Trellis — static GLB (no rig))"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb_raw]
    params:
      # torch lane retired 2026-08-26 (confetti): preset/background_color/rig_with_somax dropped - the native node
      # enforces the reference defaults (BiRefNet auto matte,
      # QEM 300K @1024, xatlas, trilinear PBR bake).
      model: trellis_native
      seed: 7
      resolution: "1024"
      texture_size: 2048
      bg_removal: auto
      image_artifact: asset_image
      dump_post: enable
      output_artifact: asset_glb_raw

  - family: trellis_native_replay
    phase: budget
    title: "Budget - QEM 60000 faces"
    consumes: [comfy_url]
    inputs: [asset_glb_raw]
    outputs: [asset_glb]
    params:
      model: trellis_native_replay
      faces_target: 60000
      atlas: 2048
      glb_artifact: asset_glb_raw
      dump_artifact: asset_glb_raw_dump
      output_artifact: asset_glb

  - family: render_glb_views
    phase: review
    title: "Turntable renders (feeds agent eyes)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [asset_views]
    params:
      glb_artifact: asset_glb
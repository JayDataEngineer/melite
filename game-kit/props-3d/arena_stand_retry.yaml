# arena_stand_retry — v2 after RECOGNISED-gate BLOCK (v1 mesh read "chair"
# 0/3 views; concept read "Two-step bench" — scale cues lost in meshing).
# Retry law: bolder proportions + second seed (7301 -> 7311, band 73xx).
# Boldness fix: LONG WIDE multi-spectator bleacher — continuous 4-seat plank
# rows, repeated leg frames — silhouette screams public seating, not furniture.
# Style suffix IDENTICAL to the arena wave (ochre planks / bone-white seats /
# bruise-violet trim, isolated game prop, plain white background).
output_dir: ./data/test-output/pipelines/pipeline_props_arena_stand_retry

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - arena stand v2"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 7311
      output_artifact: asset_image
      prompt: >-
        long wide low wooden bleacher grandstand for spectators, two stacked
        bench tiers, each tier one continuous thick plank seat board wide
        enough for four spectators sitting side by side, many short stubby
        blocky leg frames repeated along its length like stadium bleachers,
        carpentered scrap-wood construction, thick chamfered planks,
        desaturated desert-dusk ochre planks with bone-white seat boards and
        bruise-violet accent trim, flat level base sitting squarely on the
        ground, much wider than tall, monumental public seating architecture,
        one single unified carpentered object, isolated game prop, centered,
        plain white background, stylized realistic game asset, bold readable
        silhouette
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        separated objects, cropped, people, crowd, spectators, figures,
        thin delicate shapes, visible nails, roof, canopy, single chair,
        armchair, one seat, throne, Adirondack chair, stool, small furniture,
        tall narrow

  - family: trellis_native
    phase: mesh
    title: "Mesh - arena stand v2"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - arena stand v2 (QEM 5000, spec <=5k)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - arena stand v2"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

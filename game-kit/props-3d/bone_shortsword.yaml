# game-kit/props-3d/bone_shortsword.yaml — weapons wave #2 (req-20260826-125659-bone_shortsword)
#
# STYLE FAMILY: scrap_machete (request spec "Same style family as
# scrap_machete") — the machete lane's style suffix + negative prompt are
# carried VERBATIM (ART-MANIFEST law: one style family = same suffix +
# seed base). Seed band 2x = weapons (scrap_machete concept seed 23 is
# the anchor; bone_shortsword takes 24). Mesh seed 22 = kit-wide
# trellis_native convention (gen_lanes.py --mesh-seed default).
#
# BUDGET: acceptance tri_budget 5000 -> trellis_native_replay
# faces_target 5000 (V1 loot-set precedent, seven GREEN deliveries).
# Flat-shaded per spec: delivery keeps untextured-flat acceptable
# (ART-MANIFEST law 6; FBX export uses mesh_smooth_type OFF).
# Scale ~0.5 m authored sane (law 5: real-world proportions).
#
# GATE: gamekit-vision-gate neutral three-view (front/left/back),
# retry-once. Views: data/runs/<run_id>/render_glb_views_<run_id>_<view>_mesh.png

output_dir: ./data/test-output/pipelines/pipeline_props_weapons_v1_bone_shortsword

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - bone shortsword"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 24
      output_artifact: asset_image
      prompt: >-
        Chunky short sword with a broad blade ground from a single
        sun-bleached knuckle-bone, flat-shaded faceted bone surfaces,
        bruise-violet cord-wrapped grip, small bone guard, standing
        upright full weapon in frame, plain solid mid-grey background,
        flat even studio lighting with no shadows, bold readable
        silhouette, stylized fantasy game asset, clean details.
      negative_prompt: >-
        scene, environment, ground, hand, hands, person, multiple objects,
        text, watermark, cropped, busy background, drop shadow, vignette,
        photorealistic, blurry, low contrast.

  - family: trellis_native
    phase: mesh
    title: "Mesh - bone shortsword"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - bone shortsword"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - bone shortsword"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

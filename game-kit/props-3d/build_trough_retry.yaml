# retry-once lane (vision gate: floating debris) — gen_retries.py
output_dir: ./data/test-output/pipelines/pipeline_props_v1r_trough

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - trough"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 8014
      output_artifact: asset_image
      prompt: >-
        carved stone-and-wood water trough, low rectangular basin with bracing straps, shallow water surface, single compact solid object on the ground, nothing floating or detached, isolated game prop, centered, plain white background, stylized realistic game asset

  - family: trellis_native
    phase: mesh
    title: "Mesh - trough"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 23
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - trough"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 8000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - trough"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

# generated by game-kit/props-3d/gen_lanes.py --set build
output_dir: ./data/test-output/pipelines/pipeline_props_v1_campfire_unlit

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - campfire unlit"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 8002
      output_artifact: asset_image
      prompt: >-
        unlit campfire ring of sun-bleached stones with stacked dry driftwood teepee and grey ash bed, no flame, isolated game prop, centered, plain white background, stylized realistic game asset
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        objects, cropped

  - family: trellis_native
    phase: mesh
    title: "Mesh - campfire unlit"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 22
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - campfire unlit"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 8000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - campfire unlit"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

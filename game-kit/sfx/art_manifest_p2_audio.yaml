# @meta {"description": "P2 world-breadth SFX - desert day ambience loop, 2 wind gusts, 6 creature chirps; moss-sfx one-event law.", "status": "production-candidate"}
# art_manifest_p2_audio.yaml - ART-MANIFEST P2. Describe the SOUND, not the
# scene; one event per call. Seeds: 510-family.

output_dir: ./data/test-output/pipelines/pipeline_art_p2_audio

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: audio_sfx
    phase: ambience
    title: "SFX - desert day ambience loop"
    consumes: [comfy_url]
    outputs: [sfx_desert_day_amb]
    params:
      model: moss-sfx
      seed: 5100
      output_artifact: sfx_desert_day_amb
      prompt: >-
        seamless looping desert daytime ambience, low heat-shimmer drone,
        sparse dry insect ticks, faint distant sand hiss, steady wind bed,
        no distinct events, smooth loop
  - family: audio_sfx
    phase: ambience
    title: "SFX - wind gust A"
    consumes: [comfy_url]
    outputs: [sfx_wind_gust_a]
    params:
      model: moss-sfx
      seed: 5101
      output_artifact: sfx_wind_gust_a
      prompt: >-
        single dry wind gust, sandy particulate rush rising and falling,
        2.5 seconds, no rain, no voices
  - family: audio_sfx
    phase: ambience
    title: "SFX - wind gust B"
    consumes: [comfy_url]
    outputs: [sfx_wind_gust_b]
    params:
      model: moss-sfx
      seed: 5102
      output_artifact: sfx_wind_gust_b
      prompt: >-
        longer hollow wind gust, low whistle overtone with grit, 3 seconds,
        no rain, no voices
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - moss_elk bugle"
    consumes: [comfy_url]
    outputs: [vo_moss_elk]
    params:
      model: moss-sfx
      seed: 5110
      output_artifact: vo_moss_elk
      prompt: >-
        single elk bugle call, reedy rising whistle with a breathy break,
        1.2 seconds
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - bone_crane rattle"
    consumes: [comfy_url]
    outputs: [vo_bone_crane]
    params:
      model: moss-sfx
      seed: 5111
      output_artifact: vo_bone_crane
      prompt: >-
        dry hollow bone rattle clatter, hollow beak clonks in short bursts,
        0.9 seconds
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - dune_hound bay"
    consumes: [comfy_url]
    outputs: [vo_dune_hound]
    params:
      model: moss-sfx
      seed: 5112
      output_artifact: vo_dune_hound
      prompt: >-
        single low hound bay, rough-throated howl with a yipping tail,
        1.4 seconds
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - ridge_lizard hiss"
    consumes: [comfy_url]
    outputs: [vo_ridge_lizard]
    params:
      model: moss-sfx
      seed: 5113
      output_artifact: vo_ridge_lizard
      prompt: >-
        dry reptilian warning hiss, sibilant with a clicking finish,
        0.7 seconds
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - gloom_tortoise groan"
    consumes: [comfy_url]
    outputs: [vo_gloom_tortoise]
    params:
      model: moss-sfx
      seed: 5114
      output_artifact: vo_gloom_tortoise
      prompt: >-
        deep slow tortoise groan, resonant throat rumble with a wet finish,
        1.5 seconds
  - family: audio_sfx
    phase: vo-chirps
    title: "Chirp - sand_skimmer skitter"
    consumes: [comfy_url]
    outputs: [vo_sand_skimmer]
    params:
      model: moss-sfx
      seed: 5115
      output_artifact: vo_sand_skimmer
      prompt: >-
        rapid light chitinous skittering, dry clicking scuttle bursts,
        0.8 seconds

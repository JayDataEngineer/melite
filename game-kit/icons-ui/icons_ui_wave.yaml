# @meta {"description": "UI icon wave - 4 z-image game icons (weapon, trophy, consumable, navigation) on plain backgrounds.", "status": "production"}
# icons_ui_wave.yaml - survival-kit UI icons. Style suffix kept identical
# across bricks for set consistency; seeds = base 300 + index.
# Post-process for transparent sprites: qwen-img-edit "remove background".

output_dir: ./data/test-output/pipelines/pipeline_icons_ui_wave

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: icons
    title: "Icon - machete"
    consumes: [comfy_url]
    outputs: [icon_machete]
    params:
      model: z-image
      seed: 301
      output_artifact: icon_machete
      prompt: >-
        scrap iron machete weapon icon, game icon style, centered, diagonal
        blade composition, plain white background, flat even lighting, bold
        readable silhouette, stylized fantasy game asset
      negative_prompt: >-
        text, watermark, cropped, busy background, drop shadow,
        photorealistic, scene, hands
  - family: generate_image
    phase: icons
    title: "Icon - predator fang trophy"
    consumes: [comfy_url]
    outputs: [icon_fang]
    params:
      model: z-image
      seed: 302
      output_artifact: icon_fang
      prompt: >-
        large carved predator fang trophy icon, leather cord binding, game
        icon style, centered, plain white background, flat even lighting,
        bold readable silhouette, stylized fantasy game asset
      negative_prompt: >-
        text, watermark, cropped, busy background, drop shadow,
        photorealistic, scene, hands
  - family: generate_image
    phase: icons
    title: "Icon - water flask"
    consumes: [comfy_url]
    outputs: [icon_flask]
    params:
      model: z-image
      seed: 303
      output_artifact: icon_flask
      prompt: >-
        battered metal water flask canteen icon, dented surface, cork stopper,
        game icon style, centered, plain white background, flat even lighting,
        bold readable silhouette, stylized fantasy game asset
      negative_prompt: >-
        text, watermark, cropped, busy background, drop shadow,
        photorealistic, scene, hands
  - family: generate_image
    phase: icons
    title: "Icon - campfire"
    consumes: [comfy_url]
    outputs: [icon_campfire]
    params:
      model: z-image
      seed: 304
      output_artifact: icon_campfire
      prompt: >-
        small campfire with stone ring and two crossed sticks icon, warm
        embers, game icon style, centered, plain white background, flat even
        lighting, bold readable silhouette, stylized fantasy game asset
      negative_prompt: >-
        text, watermark, cropped, busy background, drop shadow,
        photorealistic, scene, hands

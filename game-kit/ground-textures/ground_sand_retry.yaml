# ground_sand_retry.yaml — vision-gate retry-once for ground_sand (cross
# pattern at wrap lines, seed 401). New seed 405, same prompt law.
output_dir: ./data/test-output/pipelines/pipeline_ground_sand_retry

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: ground
    title: "Ground - desert sand (retry)"
    consumes: [comfy_url]
    outputs: [ground_sand]
    params:
      model: z-image
      seed: 405
      width: 1024
      height: 1024
      output_artifact: ground_sand
      prompt: >-
        seamless tileable desert sand ground texture, fine wind-rippled
        grain with scattered pebbles and tiny bone chips breaking the
        ripple direction, warm ochre sand with pale bone-tone highlights,
        top-down flat diffuse view, uniform lighting, no shadows,
        stylized realistic game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props,
        scene, horizon, vignette, directional shadows, photorealistic
        lens artifacts, uniform stripes

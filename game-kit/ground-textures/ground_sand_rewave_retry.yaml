# @meta {"description": "ground_sand rewave retry - bolder grain law: NO ripples at all, pure omni-directional speckle, seed 406.", "status": "production-candidate"}
# ground_sand_rewave_retry.yaml - lineage: wave(401, rippled) FAIL ->
# retry(405, ripples+pebbles) FAIL -> rewave(405, criss-cross
# micro-ripples; the manifest's new-family wave) FAIL on dominant axis +
# cross seams. Per-wave retry-once: BOLDER = remove every directional
# element (uniform speckle only), fresh seed 406.
output_dir: ./data/test-output/pipelines/pipeline_ground_sand_rewave_retry

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: ground
    title: "Ground - desert sand rewave retry"
    consumes: [comfy_url]
    outputs: [ground_sand]
    params:
      model: z-image
      seed: 406
      width: 1024
      height: 1024
      output_artifact: ground_sand
      prompt: >-
        seamless tileable desert sand ground texture, completely uniform fine
        granular speckle with no ripples and no directional pattern whatsoever,
        evenly scattered pale grain flecks, warm ochre sand with pale bone-tone
        highlights, top-down flat diffuse view, uniform lighting, no shadows,
        stylized realistic game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props, scene,
        horizon, vignette, directional shadows, dune ridges, ripples, waves,
        directional grain, photorealistic lens artifacts

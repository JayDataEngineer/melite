# @meta {"description": "Ground texture wave - z-image square tileable albedo, seeds 401-404, tiling post-process via scripts/textures/make_tiling.py.", "status": "production-candidate"}
# ground_textures_wave.yaml - ART-MANIFEST ground-materials request class.
# Albedo squares (1024x1024); seam-blend + normal/roughness derivation and
# the 2x2 tile gate happen OFFLINE (CPU) in make_tiling.py - generation is
# plain z-image, one texture per brick, shared style suffix + 400-family
# seeds so the set reads as one biome.

output_dir: ./data/test-output/pipelines/pipeline_ground_textures

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: ground
    title: "Ground - desert sand"
    consumes: [comfy_url]
    outputs: [ground_sand]
    params:
      model: z-image
      seed: 401
      width: 1024
      height: 1024
      output_artifact: ground_sand
      prompt: >-
        seamless tileable desert sand ground texture, fine wind-rippled grain,
        warm ochre sand with pale bone-tone highlights, top-down flat diffuse
        view, uniform lighting, no shadows, stylized realistic game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props, scene,
        horizon, vignette, directional shadows, photorealistic lens artifacts

  - family: generate_image
    phase: ground
    title: "Ground - cracked earth"
    consumes: [comfy_url]
    outputs: [ground_cracked]
    params:
      model: z-image
      seed: 402
      width: 1024
      height: 1024
      output_artifact: ground_cracked
      prompt: >-
        seamless tileable drought-cracked dry earth texture, polygonal crack
        network, muted umber and dusk-grey plates with ochre dust in the
        fissures, top-down flat diffuse view, uniform lighting, no shadows,
        stylized realistic game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props, scene,
        horizon, vignette, directional shadows, photorealistic lens artifacts

  - family: generate_image
    phase: ground
    title: "Ground - bone gravel"
    consumes: [comfy_url]
    outputs: [ground_gravel]
    params:
      model: z-image
      seed: 403
      width: 1024
      height: 1024
      output_artifact: ground_gravel
      prompt: >-
        seamless tileable pebble gravel ground texture, sun-bleached warm-grey
        stones with small scattered bone fragments, cream and pale ochre tones,
        top-down flat diffuse view, uniform lighting, no shadows, stylized
        realistic game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props, scene,
        horizon, vignette, directional shadows, photorealistic lens artifacts

  - family: generate_image
    phase: ground
    title: "Ground - dune stone"
    consumes: [comfy_url]
    outputs: [ground_stone]
    params:
      model: z-image
      seed: 404
      width: 1024
      height: 1024
      output_artifact: ground_stone
      prompt: >-
        seamless tileable weathered sandstone slabs with drifted sand pooling
        in the crevices, ochre stone with bruise-violet shadowed gaps, top-down
        flat diffuse view, uniform lighting, no shadows, stylized realistic
        game ground material
      negative_prompt: >-
        text, watermark, visible seams, border, frame, objects, props, scene,
        horizon, vignette, directional shadows, photorealistic lens artifacts

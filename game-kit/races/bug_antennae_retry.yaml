# @meta {"description": "Retry-once: thick curved beetle-style antennae pair (thin-segment v1 FAILED vision gate).", "status": "production-candidate"}
# bug_antennae_retry.yaml - retry of bug_antennae.yaml (seed 407 FAIL).
# Thicker simplified forms: TRELLIS drops long thin segments.

output_dir: ./data/test-output/pipelines/pipeline_bug_antennae_retry

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - beetle antennae pair (retry)"
    consumes: [comfy_url]
    inputs: []
    outputs: [asset_image]
    params:
      model: z-image
      seed: 408
      output_artifact: asset_image
      prompt: >-
        pair of two thick curved beetle antennae, smooth glossy tapered
        segments each ending in a small round ball tip, chitinous dark
        brown, mounted on a tiny round base plate, symmetrical, plain
        white background, 45 degree view, stylized game asset
      negative_prompt: >-
        person, face, head, body, scene, environment, ground, text,
        watermark, cropped, busy background, thin wires, hair

  # -- MESH (native trellis.cpp; torch lane retired 2026-08-26) ----
  - family: trellis_native
    phase: mesh
    title: "Mesh - native (Trellis - antennae static GLB (retry))"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb_raw]
    params:
      # torch lane retired 2026-08-26 (confetti): preset/background_color/rig_with_somax dropped - the native node
      # enforces the reference defaults (BiRefNet auto matte,
      # QEM 300K @1024, xatlas, trilinear PBR bake).
      model: trellis_native
      seed: 8
      resolution: "1024"
      texture_size: 2048
      bg_removal: auto
      image_artifact: asset_image
      dump_post: enable
      output_artifact: asset_glb_raw

  - family: trellis_native_replay
    phase: budget
    title: "Budget - QEM 40000 faces"
    consumes: [comfy_url]
    inputs: [asset_glb_raw]
    outputs: [asset_glb]
    params:
      model: trellis_native_replay
      faces_target: 40000
      atlas: 2048
      glb_artifact: asset_glb_raw
      dump_artifact: asset_glb_raw_dump
      output_artifact: asset_glb

  - family: render_glb_views
    phase: review
    title: "Turntable renders (feeds agent eyes)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [asset_views]
    params:
      glb_artifact: asset_glb

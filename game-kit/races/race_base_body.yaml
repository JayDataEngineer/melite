# @meta {"description": "Race BASE BODY lane: fresh rigged humanoid via the frozen body prefix (kimodo pose suite -> Z-Image -> Qwen blue-mesh -> Nomos -> TRELLIS static -> UltraShape refine -> SOMAX SOMA-77 rig). Body-only trim of character_cards.yaml - no garment/hair/composite. Budget: tens of minutes.", "status": "production-candidate"}
# race_base_body.yaml - game-kit/races fresh-base recipe.
#
# WHEN TO USE: only when no delivered base humanoid exists to morph. TODAY the
# shipped base is data/delivery/unity/humanoids/base_human/ (keeper v2,
# source run pmt7vpqda2hylck). This lane manufactures a NEW one.
#
# CONVENTIONS (docs/asset-pipelines/3d-humanoid.md): body concept is BALD +
# minimal underwear, arms slightly away from torso, FRONT view, FLAT EVEN
# LIGHTING (F7 law - directional key light bakes into the albedo).
# PHENOTYPE: the full character lane conditions depth on the ANNY mesh via
# identity_coeffs (11 dims [gender, age, muscle, weight, height, proportions,
# cupsize, firmness, african, asian, caucasian]); house-neutral race vector
# [0.5,0.45,0.6,0.5,0.5,0.5,0,0.5,0.5,0.5,0.5] applies at the
# composite_character/soma-conditioning step (see anny_phenotype_map.yaml),
# NOT in this geometry prefix.
#
# HARD RULES inherited from 3d-humanoid.md:
#   rig_with_somax: false on the trellis brick (W12 double-bake OOM)
#   GLB-native until delivery - never file_format: fbx inside the pipeline (W15)

output_dir: ./data/test-output/pipelines/pipeline_race_base_body

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  # -- GROUP A: kimodo motion (pose suite feeds the body render) ----------
  - family: kimodo_motion
    phase: motion
    title: "Motion: walk cycle + blue-mesh & openpose front pose"
    consumes: [comfy_url]
    outputs:
      - walk_motion
      - walk_motion_openpose
      - front_image
      - front_pose
    params:
      prompt: >-
        A person walking forward at a steady pace, natural arm swing,
        confident stride, looking ahead.
      seed: 42
      duration_sec: 5.0
      diffusion_steps: 25
      output_artifact: walk_motion
      export_openpose: true
      render_mesh_color: "0.6,0.74,0.97"
      render_background: white
      render_angles:
        - {azimuth: 0, name_prefix: front, outputs: [image, pose]}

  # -- GROUP B: Z-Image clean body ----------------------------------------
  - family: generate_image
    phase: somax
    title: "Create Image - clean body render (bald adult, flat even light)"
    consumes: [comfy_url]
    inputs:   [front_pose]
    outputs:  [clean_image]
    params:
      model: z-image
      controlnets:
        - {type: openpose, strength: 0.90, start_percent: 0.0, end_percent: 1.0, artifact: front_pose}
      prompt: >-
        Adult human figure, full-body, front view, bald, hairless, smooth
        scalp, wearing only minimal tight underwear, grey studio backdrop,
        arms held slightly away from the body at a natural resting angle
        with elbows slightly bent, flat even lighting with no shadows,
        clean lineart, healthy athletic proportions, bare skin visible on
        arms, legs, torso, and face.
      negative_prompt: >-
        photorealistic, 3d realistic, western cartoon, CGI render,
        mannequin, doll, plastic, wireframe, rigging lines,
        skeleton overlay, stick figure, deformities, extra fingers,
        missing limbs, harsh shadows, loose clothing, baggy clothing,
        bodysuit, dress, hair, long hair, hairstyle, locks, accessories,
        [REDACTED 2026-11-05], naked, NSFW.
      seed: 42
      controlnet_strength_floor: 0.3
      output_artifact: clean_image

  # -- GROUP C: Qwen blue mesh --------------------------------------------
  - family: edit_image
    phase: somax
    title: "Edit Image - blue mesh mannequin"
    consumes: [comfy_url]
    inputs:   [clean_image]
    outputs:  [edited_image]
    params:
      model: qwen-img-edit-2511-int8
      preset: blue_mesh
      seed: 42
      input_artifact: clean_image
      output_artifact: edited_image
      target_size: 1024

  # -- GROUP D: Nomos upscale ---------------------------------------------
  - family: upscale_image
    phase: somax
    title: "Upscale Image - halftone-fix blue mesh (Nomos2 pixel SR)"
    consumes: [comfy_url]
    inputs:   [edited_image]
    outputs:  [edited_image_hi]
    params:
      model: pixel_upscale
      input_artifact: edited_image
      output_artifact: edited_image_hi
      filename_prefix: edited_image_hi
      downscale_first: 0.75

  # -- GROUP E: TRELLIS static body ---------------------------------------
  # -- BODY MESH (native trellis.cpp; torch lane retired 2026-08-26) --
  - family: trellis_native
    phase: somax
    title: "Trellis - body mesh (static GLB) (native)"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [body_mesh_glb]
    params:
      # torch lane retired 2026-08-26 (confetti): preset/background_color/rig_with_somax dropped - the native node
      # enforces the reference defaults (BiRefNet auto matte,
      # QEM 300K @1024, xatlas, trilinear PBR bake).
      # simplify_target 500000 superseded: engine QEM 300K @1024.
      model: trellis_native
      seed: 42
      resolution: "1024"
      texture_size: 2048
      bg_removal: auto
      image_artifact: edited_image_hi
      output_artifact: body_mesh_glb

  - family: mesh_refine
    phase: somax
    title: "Mesh Refine - UltraShape geometry cleanup (body)"
    consumes: [comfy_url]
    inputs:   [body_mesh_glb, edited_image_hi]
    outputs:  [refined_body_glb]
    params:
      model: mesh_refine
      mesh_artifact: body_mesh_glb
      reference_artifact: edited_image_hi
      preset: standard
      remove_bg: true
      seed: 42
      output_artifact: refined_body_glb
      low_vram: true
      num_sharp_points: 163840
      num_uniform_points: 163840

  # -- GROUP E3: SOMAX rig -------------------------------------------------
  - family: somax
    phase: somax
    title: "SOMAX - rig the refined body (SOMA-77 weight transfer)"
    consumes: [comfy_url]
    inputs:   [refined_body_glb]
    outputs:  [rigged_glb]
    params:
      glb_artifact: refined_body_glb
      output_artifact: rigged_glb

# @meta {"description": "Race attachment lane: arena_factor fight-master chest wrap (z-image concept -> TRELLIS static GLB -> turntable review). Self-contained keeper lorekeep_keeper_coat.yaml pattern; socketed to mixamorig:Spine1 at assembly time via scripts/delivery/socket_prop_node.py (node-parenting GLB door).", "status": "production-candidate"}
# arena_factor_chest.yaml - game-kit/races attachment lane for
# req-20260827-190320-arena_factor (P1, unity-mcp).
#
# Costume variant of base_human (keeper_bone_plate precedent), NOT a new race.
# v1 scope: ONE unified torso garment = wrapped leather chest + integrated
# low belt with shell-token pouch (rock_slab law: single carpentered object;
# multi-part compositions confuse TRELLIS). Brass armband + hand-wraps
# deferred (sub-socket budget, honest note at delivery).
#
# GATE: agent eyes on the turntable (views must agree on ONE subject =
# "leather chest wrap" / "wrapped leather chest").
#
# SOCKET LAW (races SKILL.md): this GLB is a STATIC prop. GLB-door binding
# happens host-side via scripts/delivery/socket_prop_node.py (node parenting
# under the joint node); FBX-door via blender_glb_to_fbx_socketed.py
# (2026-08-28 calibrating door: transform-normalized sockets + measure/
# correct/re-export until the shipped file re-imports on-band).

output_dir: ./data/test-output/pipelines/pipeline_arena_factor_chest

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  # -- CONCEPT ------------------------------------------------------------
  - family: generate_image
    phase: concept
    title: "Concept - detached arena_factor wrapped leather chest + belt"
    consumes: [comfy_url]
    inputs: []
    outputs: [asset_image]
    params:
      model: z-image
      seed: 761
      output_artifact: asset_image
      prompt: >-
        Sleeveless wrapped leather chest harness garment shell, bandage-wrap
        crossed leather bindings over the torso tapering into a wide low
        belt with a small shell-token pouch, scarred worn ochre leather
        with bone-white cloth trim, brass buckle, hollow garment shell
        with no body inside, detached costume prop, plain solid mid-grey
        background, flat even studio lighting with no shadows, bold
        readable silhouette, stylized fantasy game asset, full object
        centered in frame. Low-poly flat-shaded desert survivor armor,
        ochre leather and sun-bleached bone, soft dusk light.
      negative_prompt: >-
        person, face, head, body, arms, legs, sleeves, skirt below the
        waist, full outfit, jacket worn by a mannequin, dress, hair on a
        head, scene, environment, ground, text, watermark, cropped, busy
        background.

  # -- MESH (native trellis.cpp; torch lane retired 2026-08-26) ----
  - family: trellis_native
    phase: mesh
    title: "Mesh - native (Trellis - arena_factor_chest static GLB (no rig))"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb_raw]
    params:
      model: trellis_native
      seed: 44
      resolution: "1024"
      quant: q4
      texture_size: 2048
      bg_removal: auto
      image_artifact: asset_image
      dump_post: enable
      output_artifact: asset_glb_raw

  - family: trellis_native_replay
    phase: budget
    title: "Budget - QEM 40000 faces"
    consumes: [comfy_url]
    inputs: [asset_glb_raw]
    outputs: [asset_glb]
    params:
      model: trellis_native_replay
      faces_target: 40000
      atlas: 2048
      glb_artifact: asset_glb_raw
      dump_artifact: asset_glb_raw_dump
      output_artifact: asset_glb

  - family: render_glb_views
    phase: review
    title: "Turntable renders - arena_factor_chest (feeds agent eyes)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [asset_views]
    params:
      glb_artifact: asset_glb

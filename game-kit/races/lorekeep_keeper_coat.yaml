# @meta {"description": "Race attachment lane: lorekeep keeper travel coat (z-image concept -> TRELLIS static GLB -> turntable review). Self-contained keeper_leather_torso_wrap.yaml pattern; socketed to mixamorig:Spine1 at assembly time via scripts/delivery/socket_prop_node.py (node-parenting GLB door).", "status": "production-candidate"}
# lorekeep_keeper_coat.yaml - game-kit/races attachment lane for
# req-20260828-lorekeep_keeper (P0, operator).
#
# SELF-CONTAINED (keeper_leather_torso_wrap.yaml pattern). Garment DNA is the
# operator's own travel-coat prompt from the character_keeper.yaml genesis
# lane, re-expressed as a hollow attachment shell (socket law: rigid
# single-bone Spine1 binding — no limbs, no skirt past the hips).
#
# GATE: agent eyes on the turntable (views must agree on ONE subject =
# "travel coat" / "coat"). verify_glb/blind_read bricks intentionally absent
# (retired by operator order 2026-08-25; static floors uncalibrated).
#
# SOCKET LAW (races SKILL.md — LAW verified on the 2026-08-26 keeper/villager
# wave): this GLB is a STATIC prop. GLB-door binding happens host-side via
# scripts/delivery/socket_prop_node.py (node parenting under the joint node);
# FBX-door binding via container blender socket_to_bone.py +
# blender_glb_to_fbx_socketed.py. Never transfer_rig this onto the body skin.

output_dir: ./data/test-output/pipelines/pipeline_lorekeep_keeper_coat

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  # -- CONCEPT ------------------------------------------------------------
  - family: generate_image
    phase: concept
    title: "Concept - detached keeper travel coat with lowered hood"
    consumes: [comfy_url]
    inputs: []
    outputs: [asset_image]
    params:
      model: z-image
      seed: 741
      output_artifact: asset_image
      prompt: >-
        Sleeveless hip-length travel coat garment shell, cropped flat at
        the waist, worn weathered leather and heavy brown-grey canvas with
        a lowered hood hanging down the back, leather straps, brass
        buckles, repaired patches, bone-white cloth accents at the collar,
        hollow garment shell with no body inside, detached costume prop,
        plain solid mid-grey background, flat even studio lighting with no
        shadows, bold readable silhouette, stylized fantasy game asset,
        full object centered in frame. Low-poly flat-shaded desert
        survivor armor, ochre leather and sun-bleached bone, soft dusk
        light.
      negative_prompt: >-
        person, face, head, body, arms, legs, sleeves, skirt below the
        waist, full outfit, jacket worn by a mannequin, dress, hair on a
        head, scene, environment, ground, text, watermark, cropped, busy
        background.

  # -- MESH ----------------------------------------------------------------
  # -- MESH (native trellis.cpp; torch lane retired 2026-08-26) ----
  - family: trellis_native
    phase: mesh
    title: "Mesh - native (Trellis - lorekeep_keeper_coat static GLB (no rig))"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb_raw]
    params:
      # torch lane retired 2026-08-26 (confetti): preset/background_color/rig_with_somax dropped - the native node
      # enforces the reference defaults (BiRefNet auto matte,
      # QEM 300K @1024, xatlas, trilinear PBR bake).
      model: trellis_native
      seed: 44
      resolution: "1024"
      # q4 retry (run pmtd95x7knydsx4 failed q8 with native "shape_dec alloc"
      # at 4GB free VRAM; /free eviction recovered to 12GB and q4 halves the
      # resident model). Resolution stays 1024 - geometry sampling is law.
      quant: q4
      texture_size: 2048
      bg_removal: auto
      image_artifact: asset_image
      dump_post: enable
      output_artifact: asset_glb_raw

  - family: trellis_native_replay
    phase: budget
    title: "Budget - QEM 40000 faces"
    consumes: [comfy_url]
    inputs: [asset_glb_raw]
    outputs: [asset_glb]
    params:
      model: trellis_native_replay
      faces_target: 40000
      atlas: 2048
      glb_artifact: asset_glb_raw
      dump_artifact: asset_glb_raw_dump
      output_artifact: asset_glb

  - family: render_glb_views
    phase: review
    title: "Turntable renders - lorekeep_keeper_coat (feeds agent eyes)"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [asset_views]
    params:
      glb_artifact: asset_glb

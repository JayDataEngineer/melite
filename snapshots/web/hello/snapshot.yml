# snapshot.yml — keyless web scenario (DSH tier 7). This scenario owns
# no local session fixture: it borrows the canonical session from
# snapshots/session/hello (a Web rendering may explicitly borrow another
# scenario's canonical session) and reads that owner's selected parent
# generation read-only. CI forces read-only DSH_SNAPSHOT=replay.
profile: melite-test
composition: engine-tier
headerClass: v0
recordingPolicy: replay
borrows: session/hello

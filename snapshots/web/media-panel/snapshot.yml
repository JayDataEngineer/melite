# snapshot.yml — keyless web scenario (DSH tier 7). This scenario owns
# no local session fixture: it borrows the canonical session from
# snapshots/session/hello and reads that owner's selected parent
# generation read-only (the same law as web/cards-tab and
# web/melite-runs). The media sidebar's boot-staged first paint (E2-3
# arm 2, the product face the boot-feed audit F3 debt names) is a
# pure happy-dom mount of the REAL MediaPanel against a gated fetch:
# the persisted feed paints instantly with the stale chip, the fresh
# feed replaces it, the chip clears. Keyless — no lane, no host.
profile: melite-test
composition: engine-tier
headerClass: v0
recordingPolicy: replay
borrows: session/hello

card:
  id: segment-and-inpaint
  label: "Segment & Inpaint"
  description: "AI-powered object removal: segment with SAM, crop region, inpaint with diffusion, stitch back seamlessly"
  genre: image
  icon: "scissors"

families:
  - sam
  - sam3
  - sd
  - sd3
  - flux

principles:
  - "Default to SAM 2.1 Hiera Tiny for fast point/box segmentation (<20ms)"
  - "Use SAM 3 text prompts only when coordinates are unknown (e.g. 'find the mug')"
  - "Always add 64px padding to crop region for inpainting context"
  - "Apply Gaussian feathering to mask edges before stitching (sigma=10)"
  - "Use alpha blending: final = inpainted * feathered_mask + original * (1 - feathered_mask)"
  - "For multi-face disambiguation: use point prompt on specific face, not text"
  - "Crop-and-stitch is 5-10x faster than full-image inpainting"
  - "SAM 2 is faster for coordinate-based prompts; SAM 3 for open-vocabulary text"

parameters:
  segmentation_model:
    type: select
    default: "sam2.1_hiera_tiny"
    options:
      - "sam2.1_hiera_tiny"
      - "sam2.1_hiera_small"
      - "sam2.1_hiera_base_plus"
      - "sam3_vit_b"
    description: "SAM model for mask generation"

  prompt_type:
    type: select
    default: "point"
    options:
      - "point"
      - "box"
      - "text"
    description: "How to specify the target object"

  point_coords:
    type: string
    default: ""
    description: "Point coordinates as 'x,y,label' (label: 1=positive, 0=negative)"

  box_coords:
    type: string
    default: ""
    description: "Bounding box as 'x0,y0,x1,y1'"

  text_prompt:
    type: string
    default: ""
    description: "Text description (SAM 3 only, e.g. 'yellow jacket')"

  crop_padding:
    type: int
    default: 64
    min: 0
    max: 256
    description: "Padding around crop region for inpainting context"

  feather_sigma:
    type: float
    default: 10.0
    min: 0.0
    max: 50.0
    description: "Gaussian blur sigma for mask edge feathering"

  inpaint_model:
    type: select
    default: "sd_inpaint"
    options:
      - "sd_inpaint"
      - "sd3_inpaint"
      - "flux_inpaint"
    description: "Diffusion model for inpainting"

  num_inference_steps:
    type: int
    default: 20
    min: 1
    max: 100
    description: "Inference steps for inpainting"

skills:
  - id: mask-generation
    label: "Mask Generation"
    description: "Generate binary segmentation masks from point, box, or text prompts"
  - id: crop-and-stitch
    label: "Crop & Stitch"
    description: "Crop segmented region, inpaint, and blend back seamlessly"
  - id: text-to-mask
    label: "Text to Mask"
    description: "SAM 3 text-prompted segmentation without coordinates"
  - id: video-tracking
    label: "Video Object Tracking"
    description: "Track segmented object across video frames"

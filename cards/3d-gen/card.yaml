card:
  id: 3d-gen
  label: "3D Generation"
  description: "Generate 3D meshes from images or text"
  genre: 3d
  icon: "box"

families:
  - id: trellis2
    label: "TRELLIS 2"
    description: "Image-to-3D mesh with PBR textures"
  - id: sam3
    label: "SAM 3"
    description: "Image segmentation for 3D workflows"
  - id: kimodo
    label: "Kimodo"
    description: "Text/image-to-motion generation"

principles:
  - "TRELLIS 2 input must be a square image (512x512 or 1024x1024)"
  - "Default quality to 'fine' for TRELLIS"
  - "Output is GLB format — compatible with Blender, Unity, web viewers"
  - "For motion generation, default to SMPL-X skeleton"

parameters:
  image:
    type: image
    label: "Input Image"
    required: false
    tooltip: "Source image for image-to-3D"

  text:
    type: text
    label: "Text Prompt"
    required: false
    placeholder: "A red cube on a white table..."
    tooltip: "Text description for text-to-3D or motion"

  model:
    type: select
    label: "Model"
    family: trellis2
    default: "trellis-2"

  quality:
    type: select
    label: "Quality"
    default: "fine"
    options:
      - id: coarse
        label: "Coarse (fast)"
      - id: fine
        label: "Fine (balanced)"
      - id: cascade1024
        label: "Cascade 1024 (best)"

skills:
  - id: img-to-3d
    label: "Image to 3D"
    description: "Convert a single image into a 3D mesh"
  - id: text-to-motion
    label: "Text to Motion"
    description: "Generate body motion from text description"

card:
  id: image-gen
  label: "Image Generation"
  description: "Generate images from text prompts using diffusion models"
  genre: image
  icon: "image"

families:
  - id: sd
    label: "Stable Diffusion"
    description: "SD 1.x / SDXL / SD3 / FLUX text-to-image and image-to-image"

principles:
  - "Default to 1024x1024 for SDXL, 512x512 for SD1.x"
  - "Use euler_a sampler by default — it's the most versatile"
  - "20 steps is sufficient for most models; offer 30+ for quality"
  - "Always show the seed used so results are reproducible"
  - "For img2img, default strength to 0.75"

parameters:
  prompt:
    type: text
    label: "Prompt"
    required: true
    placeholder: "A photo of a cat in a spacesuit..."
    tooltip: "Describe the image you want to generate"

  negative_prompt:
    type: text
    label: "Negative Prompt"
    default: "blurry, low quality, distorted"
    tooltip: "What to avoid in the image"

  model:
    type: select
    label: "Model"
    family: sd
    default: "sdxl"

  width:
    type: int
    label: "Width"
    default: 1024
    min: 256
    max: 2048
    step: 64

  height:
    type: int
    label: "Height"
    default: 1024
    min: 256
    max: 2048
    step: 64

  steps:
    type: int
    label: "Steps"
    default: 20
    min: 1
    max: 100

  cfg_scale:
    type: float
    label: "CFG Scale"
    default: 7.0
    min: 1.0
    max: 20.0
    tooltip: "How closely to follow the prompt (higher = stricter)"

  sampler:
    type: select
    label: "Sampler"
    default: "euler_a"
    options:
      - id: euler_a
        label: "Euler A"
      - id: euler
        label: "Euler"
      - id: dpmpp_2m
        label: "DPM++ 2M"
      - id: dpmpp_2m_sde
        label: "DPM++ 2M SDE"
      - id: lcm
        label: "LCM (fast)"

  seed:
    type: int
    label: "Seed"
    default: -1
    tooltip: "-1 for random"

  lora:
    type: select
    label: "LoRA"
    family: sd
    optional: true
    tooltip: "Optional LoRA adapter to apply"

skills:
  - id: prompt-enhance
    label: "Enhance Prompt"
    description: "Rewrite a rough idea into a detailed image prompt"
  - id: img2img
    label: "Image to Image"
    description: "Transform an existing image with a text prompt"

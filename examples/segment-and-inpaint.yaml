name: segment-and-inpaint
description: "Remove an object by text prompt using SAM 3 + sd.cpp inpainting"

nodes:
  - id: segment
    type: sam3_cpp
    model: "sam3_vit_b_f16.ggml"
    prompt_type: text
    # text_prompt would come from --input text_prompt="person"

  - id: crop
    type: crop_stitch
    operation: crop
    padding: 64
    input_from:
      - segment.mask
      - segment.boxes

  - id: inpaint
    type: sd_cpp
    model: "sd-v1-5-inpainting.gguf"
    input_from:
      - crop.cropped_image
      - crop.cropped_mask

  - id: stitch
    type: crop_stitch
    operation: stitch
    feather_sigma: 10.0
    input_from:
      - crop.crop_box
      - inpaint.output
      - segment.mask

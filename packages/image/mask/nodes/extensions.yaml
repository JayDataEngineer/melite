extensions:
  # 2026-10-15: the commit pin is BACK, and the 2026-10-13 unpin was
  # the wrong cure. The zip landing was never Manager's choice: an
  # unpinned url matches Manager's channel registry map, so the ZIP
  # arm runs and lands a version with no .git (urlInstalled can then
  # never verify). An @<sha>-suffixed url cannot match the registry
  # map (manager-provider.ts: the git arm always runs), lands a real
  # clone at the sha, and the landed-HEAD verify closes. The live
  # engine proved the git arm for every @-suffixed row this date.
  - name: comfyui-impact-pack
    url: https://github.com/ltdrdata/ComfyUI-Impact-Pack
    ref: 429d0159ad429e64d2b3916e6e7be9c22d025c3c
    required: true
    desc: Impact Pack detector and segmentation nodes used by the mask card.
    pip:
      - segment-anything
      - scikit-image
      - piexif
      - transformers
      - opencv-python-headless
      - scipy
      - numpy
      - dill
      - matplotlib
      - git+https://github.com/facebookresearch/sam2@2b90b9f5ceec907a1c18123530e92e794ad901a4
  - name: comfyui-impact-subpack
    url: https://github.com/ltdrdata/ComfyUI-Impact-Subpack
    ref: 50c7b71a6a224734cc9b21963c6d1926816a97f1
    required: true
    desc: Impact Subpack detector provider used by the mask card.
    pip:
      - matplotlib
      - ultralytics>=8.3.162
      - numpy
      - opencv-python-headless
      - dill

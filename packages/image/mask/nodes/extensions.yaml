extensions:
  # 2026-10-13: the commit pin is GONE, deliberately. Manager installs
  # this pack as a registry ZIP — the live engine reports ver "8.28.3"
  # with no .git and no sha, so a declared commit could never be
  # verified by any means and the declaration was a lie about what
  # Manager installed. Under the Manager-only + verify-landed-HEAD law
  # an unverifiable pin must not be declared; the registry version is
  # the honest pin for a zip install.
  - name: comfyui-impact-pack
    url: https://github.com/ltdrdata/ComfyUI-Impact-Pack
    required: true
    desc: Impact Pack detector and segmentation nodes used by the mask card.
    pip:
      - segment-anything
      - scikit-image
      - piexif
      - transformers
      - opencv-python-headless
      - scipy
      - numpy
      - dill
      - matplotlib
      - git+https://github.com/facebookresearch/sam2
  - name: comfyui-impact-subpack
    url: https://github.com/ltdrdata/ComfyUI-Impact-Subpack
    required: true
    desc: Impact Subpack detector provider used by the mask card.
    pip:
      - matplotlib
      - ultralytics>=8.3.162
      - numpy
      - opencv-python-headless
      - dill

# W3 @ray-plugin/dsh-card-view isolated-boot overlay (port 3083; never the
# live :3080). TWO rows pointing at ONE package:
#
# - host row  — `name:` = ABSOLUTE path of the built node half. The loader
#               resolves relative entry paths against the PROFILE dir, not this
#               file (W0 failure #1), so the path must be absolute. This fiber
#               registers the /ray-proxy gateway pass-through route.
# - client row — `name:` = the package name itself. dsh-client-modules resolves
#               '<name>/package.json' from the profile tree, reads the
#               dsh.client declaration, and serves exports['./client'] at
#               /packages/@ray-plugin/dsh-card-view/client.js + lists it in
#               __DSH_BOOT__. Its fiber sets clientRowOnly: true because both
#               rows import the same module and a second route registration
#               would throw ('webserver: duplicate prefix route').
#
# NOTE: the node half emits lib/index.js (ESM + "type": "module" -> .js under
# the shared tsdown preset; same as ray-gallery), NOT lib/index.mjs.
#
# One-time profile link (makes the package-name row resolvable):
#   DSH_HOME=/tmp/ray-dsh-home dsh plugin --profile web add link:<repo>/packages/web/melite-card-view
#
# Boot:
#   DSH_HOME=/tmp/ray-dsh-home dsh --profile web \
#     --patch <repo>/packages/web/melite-card-view/test-overlay.yml --port 3083

- id: webserver
  config:
    host: 127.0.0.1
    port: 3083

- insert:
    - id: ray-card-view-host
      name: <repo>/packages/web/melite-card-view/lib/index.js
      config:
        gatewayUrl: ''  # the lanes answer in-process (R5); cross-host names the owning DSH
    - id: ray-card-view-client
      name: '@ray-plugin/dsh-card-view'
      config:
        clientRowOnly: true

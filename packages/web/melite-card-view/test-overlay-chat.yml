# Estate chat overlay (disposable): the same two melite-card-view rows as
# test-overlay.yml PLUS the estate row + tools doors, so a real chat turn
# can call melite_flow and the card can render against it — all in-process
# (the gateway kill 2026-09-10: no :33081, no gatewayUrl; the card-view
# host row takes no endpoint config).
# Port 3087; never touches the live :3080 or the verified :3083 instance.
#
#   DSH_HOME=/tmp/melite-dsh-home dsh --profile web \
#     --patch $MELITE_REPO/packages/web/melite-card-view/test-overlay-chat.yml --port 3087

- id: webserver
  config:
    host: 127.0.0.1
    port: 3087

- insert:
    - id: infer-estate
      name: '@melite-plugin/dsh-estate'
    - id: infer-tools-doors
      name: '@melite/harness-tools/doors'
    - id: melite-card-view-host
      name: $MELITE_REPO/packages/web/melite-card-view/lib/index.js
    - id: melite-card-view-client
      name: '@melite-plugin/dsh-card-view'
      config:
        clientRowOnly: true

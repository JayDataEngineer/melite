# dsh-card-deck bundle patch: inserts the host plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); activate with
# `dsh plugin --profile <name> add <path-to-melite-card-deck>`.
#
# The row is a bare plugin by package name: the node half (exports ".")
# runs in the host process (/editor static dist + /v1|/comfyui|/poser
# gateway proxies), and the `dsh.client` declaration in package.json
# makes the browser half (exports "./client", the sidebar deck +
# full-bleed DeckCanvas) load in the web GUI.
- insert:
    - id: ray-card-deck
      name: '@melite-plugin/dsh-card-deck'

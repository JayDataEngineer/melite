# dsh-estate bundle patch: inserts the estate host row plus every
# model-family row into the profile roster. Applied as a profile
# bundle layer (the `dsh.bundle.patch` manifest field) — the same
# shape as every other melite bundle row.
#
# The estate row's plugin (src/index.ts) mounts the estate's real
# composition as CHILD plugins via ctx.plugin — the loader's own
# composition mechanism (the seats disclose/load/runs/skills/queue/
# manage register in-process on the estate fiber; the browser HTTP
# doors live in the doors rows of the same composition — see
# dev_docs/plans/estate-collapse-2026-09-10.md; the second-process estate
# and its DSH→degenerate-copy proxy died with the gateway).
#
# THE FAMILY ROWS (ROADMAP "Models-boot Loader composition",
# 2026-10-13): one row per @melite/models-* package — the DSH shape.
# The Loader owns each family's lifecycle: cordis.yml visibility,
# --dump-config, Plugin Manager, and config-HMR live add/remove on
# a lane that runs dsh-hmr (dsh-base ships it config-only). Each
# family injects 'models' and activates dependency-driven once the
# estate's engine-model-catalog provider registers the service; the
# estate's census gate (engine-model-census) settles, censuses, and
# cross-validates the table before the doors mount. The manifest's
# @melite/models-* dependency rows are the declared closure that
# makes these specifiers resolvable (verify-cordis-config law); the
# census wall pins this roster to packages/models and to the
# engine's FAMILY_PLUGINS table — two spellings, one wall.
- insert:
    - id: melite-estate
      name: '@melite-plugin/dsh-estate'
    - id: family-anny
      name: '@melite/models-anny'
    - id: family-anycreature

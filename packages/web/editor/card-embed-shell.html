<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>card embed shell (DSH chrome)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #17171c; color: #eee; font: 13px system-ui; }
    #frame { display: flex; height: 100vh; }
    #left { width: 280px; flex: none; background: #1e1e26; border-right: 1px solid #333; display: flex; align-items: center; justify-content: center; }
    #center { flex: 1; min-width: 0; overflow-y: auto; background: #17171c; padding: 24px; }
    #chatcol { max-width: 900px; margin: 0 auto; }
    #spacer { height: 900px; display: flex; align-items: flex-end; justify-content: center; color: #666; }
    #toolrow { background: #22222b; border: 1px solid #333; border-radius: 10px; padding: 8px; }
    #toolf { width: 100%; border: 0; display: block; background: transparent; }
    #right { width: 360px; flex: none; background: #1e1e26; border-left: 1px solid #333; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div id="frame">
    <div id="left">LEFT SIDEBAR 280</div>
    <div id="center"><div id="chatcol">
      <div id="spacer">scroll &darr;</div>
      <div id="toolrow"><iframe id="toolf" title="cards" scrolling="no"></iframe></div>
      <div style="height:600px"></div>
    </div></div>
    <div id="right">RIGHT PANEL 360</div>
  </div>
  <script type="module" src="./src/__e2e__/embed-shell.ts"></script>
</body>
</html>

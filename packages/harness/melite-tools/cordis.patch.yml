# melite-tools bundle patch: inserts the host plugin row into a profile
# roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field); activate with
# `dsh plugin --profile <name> add <path-to-melite-tools>`.
#
# The plugin registers the estate's tool surface AND the editor's ✦
# Enhance host routes (/melite-tools/enhance — the DSH-model door, one
# execution core with the enhance_prompt tool; /melite-tools/catalog).
#
# TWO ROWS (2026-09-10 doors split): melite-tools is the tool plane
# (inject ['tools'] — activates in EVERY composition, sdk/headless
# included); melite-tools-doors is the web-route plane (inject
# webServer+llm+tools — web profiles only; server profiles disable
# the row by id, the way the estate patch does).
- insert:
    - id: melite-tools
      name: '@melite/harness-tools'
    - id: melite-tools-doors
      name: '@melite/harness-tools/doors'

# @infer/flow-tavern — cordis patch for the DSH web sidebar.
#
# The Tavern is a separate process (uvicorn, port 33091). DSH itself
# never imports it; the web sidebar just gets a button that opens it
# in a new tab. We follow the same row-naming pattern as the rest of
# the bundle family (provisioner, melite-tools, etc.) — DSH is the
# harness, the Tavern is the flow operator surface, they share the
# gateway over HTTP only.
#
# Optional disable: profiles that mount the bundle but don't want the
# button (e.g. an automation that runs headless) can stamp the row
# with `disabled: true` in their own cordis.patch.yml — the patch is
# additive, so an outer override wins.
- id: infer-flow-tavern-launch
  config:
    title: '🏛 Flow Tavern'
    description: 'Open the FastHTML sidebar UI for the flow system'
    # The button does a plain window.open; DSH doesn't proxy the
    # Tavern (that would couple two HTTP servers we want to keep
    # independent). The URL honors $FLOATER_PORT if the operator
    # moved the Tavern off 33091.
    url: !!js 'http://' + (process.env.FLOATER_HOST || '127.0.0.1') + ':' + (process.env.FLOATER_PORT || '33091')
    openIn: 'new-tab'
    icon: 'layout-sidebar'
    # Hide the button when the Tavern is not running on the machine.
    # The DSH shell pings it once on layout mount; if the ping fails
    # the row is dimmed (not removed — operators sometimes run the
    # Tavern on a different host and want the button regardless).
    healthCheck: !!js '/healthz'
    precedence: 50

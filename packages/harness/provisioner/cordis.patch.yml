# @infer/dsh-provisioner — the vanilla-DSH mount surface for the
# inference.cpp media stack.
#
# Installing this bundle into ANY profile (dsh plugin --profile <name>
# add <repo>/packages/harness/dsh/provisioner) mounts:
#
#   infer-tools          the tool registry, TWO interfaces (profile
#                        config / MELITE_HEADLESS selects): BASE = discovery
#                        (melite_discover, melite_load), the bench
#                        (melite_construct), management (comfy_manage),
#                        craft (skill_index, skill_read), audit
#                        (ledger_tail); HEADLESS adds the run doors
#                        melite_flow / run_status (queue-native).
#                        enhance_prompt is AD HOC (MELITE_ADHOC), never base.
#   infer-card-view-*    editable action cards rendered in the
#                        conversation (host row serves the editor bundle
#                        + hydrates drafts; client row renders tiles).
#   infer-card-deck      the sidebar card deck (lanes, drafts, past cards).
#   infer-media          DELETED (R3, the estate collapse) — DSH's own
#                        file/attachment/resource faces are the media
#                        system (the row below is the tombstone comment).
#   infer-gallery-host   the runs gallery (in-tree seats, or the pinned
#                        owning DSH cross-host).
#
# All rows resolve BY PACKAGE NAME through this bundle's own link:
# dependencies (pnpm workspace links back into the repo) — never baked
# absolute paths, so the repo can move without re-provisioning.
#
# ENDPOINT LAW (the estate collapse, gateway kill 2026-09-10): DSH
# is the ONLY app — there is no second process, no :33081, no
# MELITE_GATEWAY override. The tools answer in-process over the
# estate row's ctx seats; cross-host reads pin the ONE DSH that
# owns the estate state. The runs/drafts/bench faces ride Typert
# remotes where the estate bundle is mounted.
#
# PROFILE-SHAPE PIN (progressive disclosure — docs/deployment/
# dsh-profiles.md): the HOST `skill-filesystem` row is pinned OFF for
# every profile this bundle mounts. That row auto-discovers workspace
# skills and ships their descriptions into the agent context unbidden —
# the pre-loaded-surface bug the disclosure ladder retires. Discovery
# here is the estate's own surface (melite_discover →
# melite_load → skill_read), never a pre-loaded catalog. The pin
# silences the HOST layer only: a preset that genuinely wants local
# skill discovery still mounts its OWN preset-layer row. Without this
# pin the headless profile auto-injects (only dsh-web-app disables the
# host row, and headless does not bundle it). The row below is an
# OVERRIDE (column-0 `- id:`, no `insert:`): it patches the dsh-base
# row and mounts nothing.

- id: skill-filesystem
  disabled: true

- insert:
    # THE ESTATE ROW (REBUILD-9): the runs plane as host services —
    # card registry (primed defs + facts + in-process compose), the
    # runs registry (start/status/stop/list/validate, both doors),
    # and the Typert adapters. Mounts FIRST: the tools' seats
    # (draftsRemote/runsRemote) resolve from here. State root =
    # MELITE_STATE_ROOT else <cwd>/data/runs.
    - id: infer-estate
      name: '@melite-plugin/melite-estate'

    - id: infer-tools
      name: '@melite-plugin/dsh-tools'
    # The host-route plane of the same package (split 2026-09-10): the
    # ✦ doors need webServer+llm, which sdk/headless compositions do
    # not have — infer-tools stays profile-agnostic, this row is
    # web-profiles-only (the estate patch disables it).
    - id: infer-tools-doors
      name: '@melite-plugin/dsh-tools/doors'

    # ONE row now (the two-row host/client split with clientRowOnly
    # is retired — the bundle's own dsh.client declaration loads the
    # browser half; the host half is the bundle-row marker, the
    # gateway-era proxy route died with the kill).
    - id: infer-card-view
      name: '@melite-plugin/dsh-card-view'

    - id: infer-card-deck
      name: '@melite-plugin/dsh-card-deck'

    # THE ESTATE COLLAPSE (R3): @infer-media/dsh-media DELETED - DSH's
    # own file/attachment/resource faces are the media system; the
    # estate's runs/drafts ride Typert remotes (gateway-wire).

    - id: infer-gallery-host
      name: '@infer-media/dsh-gallery'

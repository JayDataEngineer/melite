# kimodo lane extension declarations (EXTENSION LAW: declared, never
# vendored under a plugin tree; the packs live as vendor submodules,
# the management plane installs). In-tree names resolve against the
# vendor/comfyui_extensions dir at the compose gate.
#
# 2026-09-06: this lane is THE kimodo (the cpp ggml lane retired the
# same day — ONE-implementation rule; the wrap won). The
# "stopgap" label in the desc below was era-naming — this pack has
# been the implementation since 2026-09-04.
extensions:
  - name: melite-kimodo-nodes
    url: https://github.com/JayDataEngineer/melite-kimodo-nodes
    ref: 0d3f31cdb1d42bafa10e797da783c50140d164fe
    required: true
    desc: KimodoLoader + KimodoTextToPose (the NVIDIA-package wrap — THE kimodo implementation) — text to SOMA-77 motion NPZ.
    # 2026-09-08 (red-closure lane): pip restated identical to the 3d
    # lane's row — ONE install unit since the 2026-09-07 merge (the
    # pack's own requirements.txt carries this pin); the pin identity
    # is the full tuple, so a pip-less restatement forked the pin and
    # extension_lane refused the whole tree.
    pip:
      - "multihmr2 @ git+https://github.com/naver/multi-hmr2.git@f066532d096034700e5ba8b7b1ca655729d3ea6e"
  # 2026-09-06 gap-fix: pin restated in the canonical shape (name +
  # registry + version, the fit/skin/anny rows) — a bare-name row
  # forked the pin and extension_lane refused the whole manifest.
  - name: melite-poser-nodes
    url: https://github.com/JayDataEngineer/melite-poser-nodes
    # 2026-10-21 estate pin re-cure: re-pinned to the current upstream main
    # (the ref the live engine serves) — content verified non-functional vs
    # the prior pin (category strings only; receipt
    # 2026-10-21-estate-pin-recure.md).
    ref: 94db78c7bc189cfd207c39d6bfacbd0c29550ef2
    required: true
    desc: RaySomaxBake — skins the motion NPZ onto a SOMAX-rigged character GLB.

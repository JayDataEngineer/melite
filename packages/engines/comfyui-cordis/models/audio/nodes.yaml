# audio ComfyUI extension dependencies.
# 2026-09-04: tts + qvoice in melite-tts-nodes, sfx in
# melite-sfx-nodes — carved from the too-heavy all-in-one; class
# names unchanged, graphs survive the swap.
# 2026-11-10: THE CARVE IS RETIRED (operator: "Why not just one?") —
# the all-in-one melite-audio-nodes kept evolving (engines/,
# qvoice.py, film_mix, loudness, the served .so) while the two
# carves went stale; three required packs racing one custom_nodes
# slot, with Audiocore* classes duplicated across them, is the race
# the old engine-tree law existed to manage. ONE pack now owns every
# Audiocore* class + MeliteQVoiceCopy; the carves are deleted
# (deployed copies + vendor trees + model-facts rows folded here).
extensions:
  # 2026-09-06 gap-fix: pins restated in the canonical shape (name +
  # registry + version) — bare-name rows forked pins and the
  # extension_lane manifest refused to serve.
  - name: melite-audio-nodes
    url: https://github.com/JayDataEngineer/melite-audio-nodes
    # c8a718b 2026-11-12 (tts NEW-3, the release door): POST
    # /audiocore/release_warmed fires release_warmed_handles() —
    # the warmed qwen3 torch seats (~4.3 GB + graphs per variant)
    # are engine-owned process-wide handles ComfyUI's native /free
    # cannot see, and no estate door could feed the Unload node
    # (it needs an AUDIOCORE_MODEL handle no caller holds outside
    # a run); comfy_manage free chains this route after native
    # /free (tolerant — a pack-less engine 404s without failing
    # the unload). Unit wall 3/3 + the control-side chain wall
    # toggle-proven. ENGINE RESTART OWED: the route serves bytes
    # only after the engine restarts. Prior 34002e6 (2026-11-12):
    # the model-management registration claim — the live probe
    # released zero bytes; the registration is absent from the
    # tree and the route is the report's named cure. Prior 99517c9
    # (2026-11-12, F12): 0b75904 pushed (sfx burn cures — keyed
    # engine residency + boot cuda refusal + residual defaults;
    # previously local-only) + MeliteAudioResample (AUDIO + target
    # INT -> AUDIO via engine-core comfy.audio.resample; equal-rate
    # passthrough returns the SAME dict) — the extend join leg rate
    # law's Layer C half. Prior aee6505 (2026-11-12): the boot env
    # assert (audit 016) — the pack refuses import when the shared
    # venv un-converges under it
    # 58c8afd 2026-11-12 (tts NEW-1 pointer, same day as c8a718b):
    # the fit gate's refusal names the REACHABLE cure — the estate's
    # free door (comfy_manage free) chains /audiocore/release_warmed
    # and drops the warmed torch seats the gate starves against, not
    # just the Unload node no estate door can feed.
    ref: 58c8afd47d863c9c7fb7f58ddb70068fe7876897
    required: true
    desc: >-
      The ONE audio pack: Qwen3-TTS synthesis (qwen3_tts — card lane
      AND studio riding faster-qwen3-tts/torch since THE FLIP
      fcd25d0, 2026-10-22; native stays for moss_tts/ace_step only),
      Voice Studio (.qvoice),
      MOSS-SFX v2 diffusion, voice embeddings, MeliteQVoiceCopy,
      film/loudness utilities. Every Audiocore* class lives here.
      2026-10-21 re-pin: the faster-backend cure (all synthesis
      through FasterQwen3TTS, silent default dead, 5.20 RoPE shim)
      with 3/3 lane renders + the served-lane proof render.
      2026-10-22 re-pin: the studio VRAM law (warm-handle cache,
      capture-at-load, compat pre-init, seq-len 2048 / decode 1792
      clamps, pre-load headroom gate, release-on-unload) — the
      Triton capture burn cured; receipt
      infra-qwen3-studio-vram-law. 2026-11-12 re-pin (F12): 0b75904
      pushed (sfx burn cures) + MeliteAudioResample, the join-rate
      door (engine-core sinc, equal-rate passthrough).
  # 2026-10-16 (the roster-rows batch): the GGUF loader family declares
  # for the §4d HF-directory model channel — the qwen3-tts .gguf weights
  # load through its nodes (ace-step died in the 2026-10-12 operator
  # kill; its loader need died with it). The roster's old spellings
  # (GGUFUnetLoader/GGUFCLIPLoader) named classes that exist nowhere
  # upstream; the row pins the real class set.
  - name: ComfyUI-GGUF
    url: https://github.com/city96/ComfyUI-GGUF
    ref: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    required: true
    desc: >-
      city96's GGUF loaders (UnetLoaderGGUF, UnetLoaderGGUFAdvanced,
      CLIPLoaderGGUF, Dual/Triple/QuadrupleCLIPLoaderGGUF) — the §4d
      HF-directory channel's .gguf weights load through them. The gguf
      pip dependency (>=0.13.0) rides the row for fresh estates.
    pip:
      - gguf

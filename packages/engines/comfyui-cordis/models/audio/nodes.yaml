# audio ComfyUI extension dependencies (the audio-core split,
# 2026-09-04: tts + qvoice in melite-tts-nodes, sfx in
# melite-sfx-nodes — carved from the too-heavy all-in-one; class
# names unchanged, graphs survive the swap)
extensions:
  # 2026-09-06 gap-fix: pins restated in the canonical shape (name +
  # registry + version) — bare-name rows forked pins and the
  # extension_lane manifest refused to serve.
  - name: melite-tts-nodes
    url: https://github.com/JayDataEngineer/melite-tts-nodes
    ref: bf65ce48f5994ac2097ae634c5163819839d9d25
    required: true
    desc: Qwen3-TTS synthesis, voice embeddings, Voice Studio (.qvoice) — tts/voice-lock lanes.
  - name: melite-sfx-nodes
    url: https://github.com/JayDataEngineer/melite-sfx-nodes
    ref: 8c046f6ad73f629aa982bb44655365bb2fdef750
    required: true
    desc: MOSS-SFX v2 diffusion — the sfx lane.
  - name: melite-audio-nodes
    url: https://github.com/JayDataEngineer/melite-audio-nodes
    ref: 968b80f537ecf9d957caa3b3787a27e533a70659
    required: true
    desc: >-
      The audio core pack, and the ONLY owner of MeliteQVoiceCopy — the
      .qvoice copy node the tts graph emits. Declared here because the
      2026-09-04 split declared the two carved packs and left this one
      undeclared, so a fresh estate installed tts+sfx and still failed
      at /prompt on a node class nothing had installed (audit
      2026-10-13). The Audiocore* classes are duplicated across the
      three packs by the split; this row is what makes MeliteQVoiceCopy
      reachable.
  # 2026-10-16 (the roster-rows batch): the GGUF loader family declares
  # for the §4d HF-directory model channel — the qwen3-tts and ace-step
  # .gguf weights load through its nodes. The roster's old spellings
  # (GGUFUnetLoader/GGUFCLIPLoader) named classes that exist nowhere
  # upstream; the row pins the real class set.
  - name: ComfyUI-GGUF
    url: https://github.com/city96/ComfyUI-GGUF
    ref: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
    required: true
    desc: >-
      city96's GGUF loaders (UnetLoaderGGUF, UnetLoaderGGUFAdvanced,
      CLIPLoaderGGUF, Dual/Triple/QuadrupleCLIPLoaderGGUF) — the §4d
      HF-directory channel's .gguf weights load through them. The gguf
      pip dependency (>=0.13.0) rides the row for fresh estates.
    pip:
      - gguf

    # The card half stamps the conditioning slice with the same
    # number (h3 actions.ts) — one law, two halves. Deployed to both
    # runtime trees (git checkout at the pin, clean), engine
    # restarted 22:58 UTC. Pack walls: tests/test_film_mix_in_sec.py
    # 5/5; prior pin ff7568a contained.
    ref: d3ae356f484e447ad65a405e97072ff86f30085f
    required: true
    desc: >-
      The ONE audio pack: Qwen3-TTS synthesis (qwen3_tts — card lane
      AND studio riding faster-qwen3-tts/torch since THE FLIP

  # registry + version) — bare-name rows forked pins and the
  # extension_lane manifest refused to serve.
  - name: melite-audio-nodes
    url: https://github.com/JayDataEngineer/melite-audio-nodes
    # c8a718b 2026-11-12 (tts NEW-3, the release door): POST
    # /audiocore/release_warmed fires release_warmed_handles() —
    # the warmed qwen3 torch seats (~4.3 GB + graphs per variant)
    # are engine-owned process-wide handles ComfyUI's native /free
    # cannot see, and no estate door could feed the Unload node
    # (it needs an AUDIOCORE_MODEL handle no caller holds outside
    # a run); comfy_manage free chains this route after native
    # /free (tolerant — a pack-less engine 404s without failing
    # the unload). Unit wall 3/3 + the control-side chain wall
    # toggle-proven. ENGINE RESTART OWED: the route serves bytes
    # only after the engine restarts. Prior 34002e6 (2026-11-12):
    # the model-management registration claim — the live probe
    # released zero bytes; the registration is absent from the
    # tree and the route is the report's named cure. Prior 99517c9
    # (2026-11-12, F12): 0b75904 pushed (sfx burn cures — keyed
    # engine residency + boot cuda refusal + residual defaults;
    # previously local-only) + MeliteAudioResample (AUDIO + target
    # INT -> AUDIO via engine-core comfy.audio.resample; equal-rate
    # passthrough returns the SAME dict) — the extend join leg rate
    # law's Layer C half. Prior aee6505 (2026-11-12): the boot env
    # assert (audit 016) — the pack refuses import when the shared
    # venv un-converges under it
    # 69a4838 2026-11-01 (the soundtrack merged-form wire, conditioning
    # half): MeliteAudioTensorSlice — the stamped window's tensor seat
    # (a typed AUDIO socket `audio_tensor`; the file slice node's Combo
    # seat can never take a producer link) with the file node's exact
    # slice law minus folder_paths; the h3 compose seats a spelled
    # conditioning stamp here and the merge lands the producer's link
    # (session 1's interim conditioning door deleted estate-side).
    # ENGINE RESTART OWED (the pack is rsynced; the class serves only
    # after the boot — the boot-fixture regen + the fixture-derived
    # wall arm + the extension-manifest regen ride the consolidated
    # window). Contained within it: 0023243 2026-11-01 (the film
    # tail: WIRED_CLIP_SEATS=4 + optional wired_audio_1..4 AUDIO
    # seats — a clips_json row MAY omit src IFF it carries wired: k
    # (the h3 compose seats a $spell src on the seat; the merge lands
    # the producer's link there); wired seats refuse foreign rates and
    # unset seats loud; the $spell clip-src refusal names the cure;
    # the stale env-arms docstring fixed — its own restart was owed
    # then; both pins serve after ONE boot). Contained within that:
    # nothing — straight child of e4e4c13.
    # e4e4c13 2026-11-01 (vendor re-cure: audiocpp/qwen3_tts homes ride
    # folder categories — the upstream env-strip wall's re-pin; the
    # 0c6d045 DECL row lagged the f2b5934 gitlink move and the sync
    # tripwire caught it). Contained within it: 0c6d045 2026-11-01
    # (F30 vendor half: MeliteQVoiceCopy never renames the mint +
    # receipts saved_qvoice_path beside voice_file). Prior pin 58c8afd
    # (2026-11-12 tts NEW-1 pointer;
    # the fit gate's refusal names the REACHABLE cure) is contained.
    # ff7568a 2026-11-01 (TTS mod-surface quartet, the audit brief's
    # P1): c8cda2a cures F51+F50 — voice_strength STEERS IDENTITY
    # from the bank neutral (steered = neutral + (emb − neutral) ×
    # strength; s=1.0 short-circuits byte-identical, measured live;
    # no-bank degrades loud to identity; the ">0.9 PCM corr"
    # acceptance was proven architecturally unsatisfiable — the
    # embedding conditions the codec prefill, so PCM corr is a
    # bit-identity detector, and the audit's 0.10 was its noise
    # floor) and speaker_name leaves AudiocoreTTS's required block
    # (the phantom required speaker, F50). ff7568a rides docstring-

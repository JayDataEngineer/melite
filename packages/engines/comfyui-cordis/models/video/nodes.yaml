# video ComfyUI extension dependencies
#
# (Cordis 2026-09-07: melite-video-nodes is archived — unconsumed
# lane stub. video-gen's real declaration rides the card
# (requires = ComfyUI-VideoHelperSuite), resolved live by the
# compose gate.)
#
# 2026-10-28 (swap-parity build): the three upstream H3 edit packs.
# Bulk /object_info census the same day: native ComfyUI 0.42.0 ships
# the H3 generation nodes (MiniMaxH3ReferenceToVideo) but NONE of the
# edit nodes (H3PeopleMask, H3GreyMannequins, H3SourceSlice,
# FantasticVideoEditLatent, ContexMaskedTarget) — the R0a mask card
# and the R1 replace mod cannot compose without these rows
# installed. Sources attested in the reference repo's own README
# (/tmp/openjutsu-ref @ 47c3724).
extensions:
  - name: comfyui-h3-oneclick-swap
    url: https://github.com/D3voz/comfyui-h3-oneclick-swap
    ref: df67f4bfa7348742e1b340dd11cc64714d83f323
    required: true
    desc: H3PeopleMask + H3GreyMannequins + H3SourceSlice (the Source Slice commit is HEAD) + swap/montage plans — the mask + mannequin + slice seats. No extra pip deps (upstream: torch/numpy/Pillow ride ComfyUI).
  - name: ComfyUI-MiniMaxH3-Context-Loop
    url: https://github.com/JayDataEngineer/ComfyUI-MiniMaxH3-Context-Loop
    ref: e6d700d731a3803aa18a6c6036a24aa6d9fa5b3c
    required: true
    desc: Clip chaining, checkpoints, masked targets (ContexMaskedTarget), MaskGridPreview, final assembly — the edit-target + loop seats. Estate-maintained fork (GPL-3.0, upstream history preserved): ethanfel force-pushed past the estate h3-chain gap cures (e6d700d7), orphaning the pinned line — the fork carries those bytes. Upstream floor 0.7.3+. No requirements file.
  - name: ComfyUI-Fantastic-MiniMaxH3-PromptBuilder
    url: https://github.com/Adudeguyman/ComfyUI-Fantastic-MiniMaxH3-PromptBuilder
    ref: 22e719fe89336c628383363182a4da3cb58d4f9b
    required: true
    desc: MiniMaxH3FantasticVideoEditLatent — the masked edit latent seat for the R1 replace mod.
    pip:
      - av
- name: ComfyUI-CrossViewWarp
  url: https://github.com/comfyrob/ComfyUI-CrossViewWarp
  # 2026-11-13 — re-pinned from cseti007@3266a83a84eaa6833a9ebc38ac
  # dd8789e44f5b to Comfy-Org's official comfyrob fork at the exact
  # revision comfy-reshoot's build/model-files.md pins: the fork
  # carries CrossViewPrepareClip (the clip-normalization stage the
  # official chain leads with) alongside CrossViewWarp. The
  # 2026-11-13 official reshoot rework rides this revision. The VDA
  # depth row below died with the rework (MoGe core nodes replaced
  # the depth half).
  ref: fbb1e93c7193329ff3ce7c17f95166b539687876
  required: true
  desc: >-
    CrossViewWarp (Apache-2.0, the comfyrob fork at the official
    comfy-reshoot revision) — CrossViewPrepareClip (24 fps resample,
    H3 17k+5 frame-grid snap, aspect/pixel-budget normalize) +
    CrossViewWarp (metric-geometry reprojection under a moved
    camera). Declared on the video plane for camera-move
    compositions; addressed by the h3-timeline re-shoot chain
    (feature 024, reworked 2026-11-13 onto Comfy-Org's
    comfy-reshoot reference chain: prepare -> MoGe metric geometry ->
    one warp; the retired VDA depth chain + Fun ControlNet apply
    seat died with the rework). Pip: nothing beyond the ComfyUI base
    env.
- name: ComfyUI-CameraReference3D
  url: https://github.com/lovemachine100/ComfyUI-CameraReference3D
  ref: 3b360a2bc76bd46b8367ab72384e0a71bb8bf701
  required: true
  desc: >-
    CameraReference3D (MIT, kongo_jun, v3.0.1) — model-agnostic camera-motion
    hub: CameraReference3D (parametric moves + timeline DSL), CameraTrajectoryExport,
    CameraPathFromVideo. Declared on the video plane for camera-driven
    compositions; no graph addresses its classes yet. Pip: numpy +
    Pillow (both core-provided by the ComfyUI base env).

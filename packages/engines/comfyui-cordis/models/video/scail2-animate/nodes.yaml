# scail2-animate — ComfyUI extension dependencies (cluster E boarding,
# 2026-09-04). The SCAIL-2 lane rides ComfyUI CORE nodes
# (WanSCAILToVideo, UNETLoader, CLIPLoader, VAELoader,
# ModelSamplingSD3, KSampler, VAEDecode) plus VHS for the driving
# video + film container — no WanVideoWrapper, no SAM3 for the
# minimal lane (the colored-mask path lands with the mask arc).
extensions:
- name: ComfyUI-VideoHelperSuite
  registry: comfyui-videohelpersuite
  version: 1.7.9
  required: true
  desc: VHS_LoadVideoPath (driving video) + VHS_VideoCombine (film).

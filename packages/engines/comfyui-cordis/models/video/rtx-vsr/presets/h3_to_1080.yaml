# ─── Preset: the recommended H3 flow ────────────────────────────────
# Generate at 768p → RTX VSR 2-pass to 1080p. Fastest path that preserves
# motion coherence. Audio passes through.
# Tree migration 2026-08-16: moved verbatim from the flat video_upscale.yaml
# file-level `presets:` block (never attached by the flat loader; the tree
# attach RESTORES these — the file stem IS the preset id).

label: H3 → 1080p (RTX VSR)
description: >-
  Upscale MiniMax H3 output from 768p to 1080p via Nvidia RTX VSR. 2-pass:
  DeBlur (motion blur removal) then VSR (AI super-resolution). Fastest
  pathway — preserves the motion coherence H3's fl2va conditioning produces.
params:
  mode: rtx_vsr
  rtx_two_pass: true
  rtx_mode: vsr
  rtx_strength: 0.6
  target_resolution: 1080

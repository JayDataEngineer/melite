# THE LORA STACK — lane data the plugin owns, next to its model (the
# same channel as card_knobs.yaml).
#
# ONE-TO-ONE WITH PLAGUEKIND (operator, 2026-09-20): the 768p turbo
# rides SOLO at 0.6 — the fro row dropped (plaguekind's turbo-lora
# setup, presets.yaml turbo-768; his V9 runs effectively solo too).
# The V7-era two-stack is retired, never a fallback. One row, one

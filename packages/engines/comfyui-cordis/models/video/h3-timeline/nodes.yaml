    the Continuum/Flow/Sol/VDN/Spectrum siblings) — upstream ships
    NO LICENSE file (unlicensed; operator clearance owed before
    estate reliance). Pip: einops (torch/safetensors are
    core-provided). Re-pin only with a composed re-render.

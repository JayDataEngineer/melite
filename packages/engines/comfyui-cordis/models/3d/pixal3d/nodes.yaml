# Pixal3D ComfyUI extension dependencies
#
# ONE PATTERN: shared 3d-lane packs (TRELLIS.2 core nodes ship with
# ComfyUI 0.34+, ComfyUI-BiRefNet) are declared ONCE in
# trellis2-native/nodes.yaml — do NOT redeclare here (duplicate names
# fail loud at merge). This file declares only what is UNIQUE to the
# pixal3d family.
#
# Pixal3D's only lane-specific extension is ComfyUI-MoGe (per-image
# FOV → camera transform matrix → pixel-aligned embeddings). The
# compose gate refuses to run if the declared extension isn't
# installed (required:true, the pixal3d lane cannot compose without
# MoGe — the camera transform is mandatory for the conditioning).
extensions:
  - name: ComfyUI-MoGe
    url: https://github.com/kijai/ComfyUI-MoGe.git
    ref: 8276bab
    version: "0.5.0"
    required: true
    desc: "MoGe depth estimation — pixel-aligned camera conditioning for Pixal3D (camera_angle_x → camera transform matrix → per-token pixel alignment). Required: pixal3d conditioning will not compose without it."

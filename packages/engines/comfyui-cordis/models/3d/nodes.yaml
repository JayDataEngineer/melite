# 3d ComfyUI extension dependencies (genre-level in-tree packs).
# ONE-PATTERN: every extension link lives in exactly ONE nodes.yaml;
# family-specific node packs that ship WITH the estate declare here.
#
# ANNY PATH RECORD (2026-09-03): melite-anny-nodes (our ctypes anny
# shape-basis pack) retired — zero consumers; the anny shape lane lives
# in the ray Body Studio HTTP flow. Upstream ameliacode/
# ComfyUI-SMPLx-Estimator was evaluated as the replacement and
# DISQUALIFIED: every graph requires Load SMPLx -> SMPLX_NEUTRAL.npz,
# and SMPL-X is paywalled (operator: "we never use SMPLX"). The
# license-clean image->humanoid path is anny-native: Multi-HMR2 (free
# NAVER non-commercial ckpt) predicts anny directly; anny is Apache
# 2.0; SOMA-X/kimodo (NVIDIA, free) already serve the rig/motion side
# in the ray estate. A downstream SMPL-X->SOMA-X converter cannot
# remove the paywall — the SMPL-X file is needed at prediction time.
# Anny estate (2026-09-07 merge: the melite-anny-estimator-nodes pack
# folded INTO melite-kimodo-nodes — one install unit for the humanoid
# family, shared torch/melite_model_base spine. This lane declares the
# SAME pack the motion lane declares; node type names unchanged, so
# flows/templates/snapshots keep working. NAVER non-commercial research
# ckpts (multihmr2.pt auto-downloads; anny-fit's checkpoints live in
# the side checkout per its INSTALL.md).
extensions:
  - name: melite-kimodo-nodes
    url: https://github.com/JayDataEngineer/melite-kimodo-nodes
    # 2026-10-23 pack cure re-pin (same as the motion lane's row —
    # ONE install unit): f283926 reads the chain's own artifact name
    # and is pushed to origin/main.
    ref: 6685fa7f07706bf637d37b3e50ff1529f2408bfb
    required: false
    desc: >-
      Image -> Anny (all-age parametric human model), both engines:
      MultiHMR2ImageToAnny wraps naver/multi-hmr2 (regression,
      in-process, VRAM-tracked via melite_model_base) — multi-person
      Anny params (.pkl world param) + meshes (.glb) + optional render.
      AnnyFitOptimize wraps naver/anny-fit (camera-space optimization,
      out-of-process over ANNYFIT_SRC) — preprocess (detect+ViTPose+
      camera+densekp+VLM+MultiHMR init) -> optimize -> refined params
      (.npz) + before/after renders. NAVER non-commercial licenses
      on both upstreams; Anny itself Apache 2.0.
    pip:
      - "multihmr2 @ git+https://github.com/naver/multi-hmr2.git@f066532d096034700e5ba8b7b1ca655729d3ea6e"
  # (the quad-remesh install row the excision ordered dead —
  # 458c4001 — is gone; its dangling ref/desc/pip fields used to
  # fold into THIS row as duplicate keys, repinning it to the dead
  # pack and diverging from the motion lane's identical declaration.
  # The autoremesher shell requirement died with the pack.)
  # 2026-10-13 (the extension census): the pack is checked at
  # runtime — extension_node_types names its classes, so a missing
  # pack is a refusal — yet NO manifest ever installed it, so a fresh
  # estate refused 3d lanes it had no way to satisfy.
  # 2026-10-18 (operator ruling, audit 008 M15 — the M12 shape,
  # Unity's turn): melite-unity-nodes LEFT this manifest and the
  # estate. MeliteUnityBatch was composed by zero graphs and a
  # Unity bench is a DSH profile concern, exactly the Blender
  # ruling's law (li-en). The registry node
  # data-engineer/melite-unity-nodes 0.1.0 stays published-dormant
  # (published versions are immutable); the live engine's imported
  # classes ride its next restart (operator window).

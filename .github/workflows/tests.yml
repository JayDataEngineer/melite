name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fast-suite:
    # The README's documented runner — the TS walls are the whole
    # fast suite (node tests/walls/ts/run.mjs). The py battery
    # tests/walls/suites/*.py and the estate pytest planes
    # (tests/unit, tests/routes) are deleted per NO-ESTATE-PYTHON
    # LAW, never revived. Live GPU inference stays opt-in locally —
    # it needs the standing gateway + ComfyUI and is never CI's
    # to spend.
    name: walls (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the fast suite
        run: node tests/walls/ts/run.mjs

name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# THE PORTABILITY SEAT (2026-09-25; recut 2026-11-05): macOS and Windows
# judge the PUBLISHED SURFACE — the packages this repo ships to npm/GitHub
# for DSH consumers (`packages/*/*/tests`, `packages/*/*/test`). The
# repo-internal walls tier (tests/walls/ts/suites) asserts against
# Linux-coupled repo/engine/submodule trees and self-skips loudly where a
# host cannot judge it; running it on every OS produced only that skip
# noise and reds (2026-11-05 tip: 24/24 suite failures were walls, zero
# package specs). Ubuntu keeps the full battery. If a future change
# reintroduces a host binary into a PUBLISHED package, the macOS/Windows
# package legs still catch it.
jobs:
  unit:
    name: unit (vitest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # HONEST BUDGET (CI, 2026-11-05): 30m never once held — ubuntu's
    # leg was cancelled at the wall in every run (the suite needs
    # >30m on a shared 3-4-core runner; the dev machine that verified
    # the battery locally is neither shared nor cold). 60m is the
    # measured-class budget, not a number picked to hide a hang: a
    # real hang still reds here, it just stops being cancelled
    # mid-suite into a log nobody can read.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # THE TIER DELEGATION (cruft row 2, 2026-10-12): the typecheck
    # wall cost ~116s of identical tsc work and CI paid it once per
    # OS leg plus once in coverage — five runs per PR with the ship
    # playbook's step. It now runs ONCE, in the typecheck job below,
    # via the same wall file; the other seats set the delegation env.
    env:
      MELITE_TIER_DELEGATED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Build (battery order law: build-plane first, then walls)"
        run: pnpm run build
      - name: Lib sync (a fresh build reproduces the committed lib/)
        # bash on EVERY leg (CI, 2026-11-05): windows defaults `run`
        # to pwsh and the POSIX test below died at parse — "Missing
        # '(' after 'if'" — before judging a single byte of drift.
        shell: bash
        run: |
          # GT-06 (the round-5 gate audit): git diff is BLIND to
          # untracked files — a build emitting a brand-new lib path
          # rode this gate green. The porcelain sweep sees both.
          # (class B D6: the unit job builds the same plane the tiers
          # job does — the drift gate rides BOTH seats.)
          git diff --exit-code -- '**/lib/**' || {
            echo "CI FAIL: lib/ drifted from a fresh build — the artifact must land in the same commit as the src";
            git status --porcelain -- '**/lib/**';
            exit 1;
          }
          UNTRACKED="$(git status --porcelain -- '**/lib/**')"
          if [ -n "$UNTRACKED" ]; then
            echo "CI FAIL: a fresh build emitted UNTRACKED lib files the diff cannot see:"
            echo "$UNTRACKED"
            exit 1
          fi
      # THE PUBLISHED-SURFACE SPLIT (2026-11-05, operator order: "why
      # do we test against different systems?"). The 2026-09-25
      # portability seat ran the WHOLE battery — walls included — on
      # all three OSes to catch a reintroduced host binary. The
      # evidence says it caught something else: on the 2026-11-05 tip
      # all 24 failing suites were tests/walls/ts/suites/* (zero
      # package specs), i.e. the repo-internal walls tier asserting
      # against Linux-coupled repo/engine/submodule trees. The walls
      # tier's own law is keyless self-skip when the host cannot
      # judge it — which hollowed the canary exactly where it was
      # supposed to fire. The portable product is the 76 packages
      # published to npm/GitHub (the DSH consumer surface); those are
      # what macOS/Windows judge. Ubuntu keeps the full battery, walls
      # included, where they are judgeable.
      - name: Unit (full battery)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test
      - name: Unit (published surface — portability seat)
        if: matrix.os != 'ubuntu-latest'
        run: node node_modules/vitest/dist/cli.js run packages/

  # THE TYPECHECK SEAT (cruft row 2): one ubuntu job owns the whole
  # typecheck wall — the src net (every packages/* tsconfig, tsc
  # --noEmit) and the test tier (spec files + repo tier) — by running
  # the wall file itself, unchanged. tsc is OS-independent; the unit
  # matrix above still owns OS portability of the runtime battery.
  typecheck:
    name: typecheck wall (src net + test tier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck wall
        run: pnpm exec vitest run tests/walls/ts/suites/typecheck-gate.spec.ts

  # THE BOUNDARY LINT SEAT (schema-gate-inventory fix 5, 2026-10-12):
  # `pnpm run lint` (tools/arch-lint.ts — the four estate boundary
  # contracts) was declared in package.json but wired into nothing;
  # boundaries do not vary by OS, so one ubuntu seat suffices.
  arch-lint:
    name: arch-lint (estate boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Boundary contracts
        run: pnpm run lint

  # THE KNIP RATCHET SEAT (re-audit 2026-10-16b A1, 2026-10-17):
  # knip + knip.json existed but were wired into nothing — the exact
  # defect class lefthook.yml names for pnpm run lint. The ratchet
  # (tools/knip-budget.mjs) pins the measured backlog; it fires when
  # a category GROWS and the budgets only ratchet down, in the same
  # commit as the cure. OS-independent — one ubuntu seat.
  knip:
    name: knip budget (dead-code ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Budget ratchet
        run: pnpm run knip

  # THE PYTHON SEAT (re-audit 2026-10-16b A3, 2026-10-17): four
  # pytest files test vendored Layer C python (melite-audio-nodes'
  # nodes/film_mix/core/moss engines) that no TS wall can reach —
  # they were installed, green, and wired to NOTHING. The blender
  # fifth (pointed at the deleted mcp_server.py) is deleted, not
  # ported. ubuntu-latest ships python3; the job installs pytest.
  pytest:
    name: pytest seat (vendored layer C)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install pytest
      - name: Vendored-python tests
        # the same command pnpm run test:py wraps; run directly so
        # this seat needs no pnpm install for four self-loading files
        run: python3 -m pytest tests/ -q

  coverage:
    name: coverage gate (per-file 100%)
    runs-on: ubuntu-latest
    # HONEST BUDGET (CI, 2026-11-05): the instrumented run measures
    # the whole estate — it burned 26m before its own threshold
    # verdict in the Nov-4 run and was cancelled at the 30m wall in
    # the Nov-5 one, leaving no readable report. 45m lets the gate
    # FINISH and name its debts; the debts themselves are real
    # (runsExecute/discovery/melite-view/media-probe under their
    # pinned thresholds) and are owed tests, not minutes.
    timeout-minutes: 45
    # Cruft row 2: the tier runs in the typecheck job; the coverage
    # gate measures src coverage and never needed the tsc sweep.
    env:
      MELITE_TIER_DELEGATED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # THE VENDORED-TREE LAW: the coverage gate's concurrent
          # walls pool judges the vendored packs' bytes (cold-clone
          # archives, the blender-lane pack sweep) — a submodule-less
          # checkout serves empty vendor dirs and those walls red
          # with "expected 0 to be greater than 100" while the same
          # tree is green wherever submodules materialize. Every
          # seat that judges vendor bytes fetches vendor bytes.
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Build (battery order law: build-plane first, then walls)"
        run: pnpm run build
      - name: Coverage gate
        run: pnpm run test:coverage

  tiers:
    name: tiers (e2e self-skip + expected + bench + snapshot + web replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Real-API e2e (keyless self-skip)
        run: pnpm run test:e2e
      - name: Build (expected tier's built arms run against real output)
        run: pnpm run build
      - name: Lib sync (a fresh build reproduces the committed lib/)
        # explicit bash (CI, 2026-11-05): this leg runs ubuntu today,
        # but the unit job's twin copy red a whole OS leg under pwsh
        # — parallel values carry their shell explicitly.
        shell: bash
        run: |
          # GT-06 (the round-5 gate audit): git diff is BLIND to
          # untracked files — a build emitting a brand-new lib path
          # rode this gate green. The porcelain sweep sees both.
          git diff --exit-code -- '**/lib/**' || {
            echo "CI FAIL: lib/ drifted from a fresh build — the artifact must land in the same commit as the src";
            git status --porcelain -- '**/lib/**';
            exit 1;
          }
          UNTRACKED="$(git status --porcelain -- '**/lib/**')"
          if [ -n "$UNTRACKED" ]; then
            echo "CI FAIL: a fresh build emitted UNTRACKED lib files the diff cannot see:"
            echo "$UNTRACKED"
            exit 1
          fi
      - name: Owner-local expected output
        run: pnpm run test:expected
      - name: Benchmarks
        run: pnpm run test:bench
      - name: Snapshot replay (read-only)
        run: DSH_SNAPSHOT=replay pnpm run test:snapshot
      - name: Web snapshot replay (read-only)
        run: DSH_SNAPSHOT=replay pnpm run test:web
      # THE BROWSER-WALL CI SEAT (roadmap §9, fresh-checkout repair
      # 2026-09-25): the studio lane boots from the TRACKED portable
      # seed (packages/web/melite-card-view/e2e/profile-seed —
      # relative links, deps materialized at boot) and runs in
      # REQUIRE mode: a missing prerequisite FAILS the seat, a
      # self-skip can never green it. Playwright browsers first.
      # THE DSH RUNTIME (2026-10-30): the lane boots through the dsh
      # binary (floor 0.2.0-rc.1, enforced in-lane) — a fresh runner
      # has none, and REQUIRE mode loud-failed the seat on every run.
      # The version rides the provisioner's own range (no literal to
      # rot); pnpm/action-setup keeps the global bin on PATH. The
      # step runs INSIDE the provisioner dir so the require spells a
      # short relative path — the gitleaks llm-keystore-key rule
      # fires on 32+ [A-Za-z0-9/] runs, and the repo-rooted manifest
      # path is one (a path, not a key; same false-positive class as
      # the manifest directory rows).
      - name: Install dsh (the studio lane's provisioned runtime)
        working-directory: packages/harness/provisioner
        run: pnpm add -g "@deepseek-ai/dsh@$(node -p "require('./package.json').peerDependencies['@deepseek-ai/dsh']")"
      - name: Install Playwright browsers (the studio lane's own)
        run: pnpm --filter @melite-plugin/dsh-card-view exec playwright install --with-deps chromium
      - name: Studio browser wall (tracked seed, REQUIRE mode)
        run: E2E_STUDIO_REQUIRE=1 pnpm run test:e2e:studio

  # THE COLD-START SEAT (operator 2026-11-04: "a user FROM NOTHING runs
  # the simple commands and starts generating with Krea-2 — provably,
  # with a container proving it's clean"): the driver's container face
  # alone — a naked node container, a fresh DSH_HOME, the official
  # `dsh plugin add` against the PUBLIC github remote, and the composed
  # profile carrying the melite bundle rows. The driver is a standalone
  # .mjs riding docker only, so this seat needs no pnpm install; the
  # engine arms stay opt-in locally (tests/coldstart) — CI never
  # downloads a weight.
  cold-start-proof:
    name: 'cold-start proof (container face — seat from nothing)'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Container seat proof
        run: 'node tools/cold-start-proof.mjs --container-only --remote "github:JayDataEngineer/melite#v0.2.2-alpha"'

  # No walls job: the wall suites run inside `unit` (root vitest
  # node project). Live GPU inference stays opt-in locally — it needs
  # the standing gateway + ComfyUI and is never CI's to spend.

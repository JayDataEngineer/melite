name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# THE PORTABILITY SEAT (2026-09-25): the unit battery runs on all three
# runner families. That is only possible because the media probe is
# TypeScript — `melite_view` reads a container's boxes in-repo
# (packages/harness/melite-tools/src/tools/mp4Probe.ts) instead of
# shelling out to ffprobe, so the suite declares no host binary and no
# Linux-only package. If a future change reintroduces a subprocess, this
# matrix is what catches it.
jobs:
  unit:
    name: unit (vitest, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # THE TIER DELEGATION (cruft row 2, 2026-10-12): the typecheck
    # wall cost ~116s of identical tsc work and CI paid it once per
    # OS leg plus once in coverage — five runs per PR with the ship
    # playbook's step. It now runs ONCE, in the typecheck job below,
    # via the same wall file; the other seats set the delegation env.
    env:
      MELITE_TIER_DELEGATED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Build (battery order law: build-plane first, then walls)"
        run: pnpm run build
      - name: Unit
        run: pnpm run test

  # THE TYPECHECK SEAT (cruft row 2): one ubuntu job owns the whole
  # typecheck wall — the src net (every packages/* tsconfig, tsc
  # --noEmit) and the test tier (spec files + repo tier) — by running
  # the wall file itself, unchanged. tsc is OS-independent; the unit
  # matrix above still owns OS portability of the runtime battery.
  typecheck:
    name: typecheck wall (src net + test tier)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck wall
        run: pnpm exec vitest run tests/walls/ts/suites/typecheck-gate.spec.ts

  # THE BOUNDARY LINT SEAT (schema-gate-inventory fix 5, 2026-10-12):
  # `pnpm run lint` (tools/arch-lint.ts — the four estate boundary
  # contracts) was declared in package.json but wired into nothing;
  # boundaries do not vary by OS, so one ubuntu seat suffices.
  arch-lint:
    name: arch-lint (estate boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Boundary contracts
        run: pnpm run lint

  # THE KNIP RATCHET SEAT (re-audit 2026-10-16b A1, 2026-10-17):
  # knip + knip.json existed but were wired into nothing — the exact
  # defect class lefthook.yml names for pnpm run lint. The ratchet
  # (tools/knip-budget.mjs) pins the measured backlog; it fires when
  # a category GROWS and the budgets only ratchet down, in the same
  # commit as the cure. OS-independent — one ubuntu seat.
  knip:
    name: knip budget (dead-code ratchet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Budget ratchet
        run: pnpm run knip

  # THE PYTHON SEAT (re-audit 2026-10-16b A3, 2026-10-17): four
  # pytest files test vendored Layer C python (melite-audio-nodes'
  # nodes/film_mix/core/moss engines) that no TS wall can reach —
  # they were installed, green, and wired to NOTHING. The blender
  # fifth (pointed at the deleted mcp_server.py) is deleted, not
  # ported. ubuntu-latest ships python3; the job installs pytest.
  pytest:
    name: pytest seat (vendored layer C)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install pytest
      - name: Vendored-python tests
        # the same command pnpm run test:py wraps; run directly so
        # this seat needs no pnpm install for four self-loading files
        run: python3 -m pytest tests/ -q

  coverage:
    name: coverage gate (per-file 100%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cruft row 2: the tier runs in the typecheck job; the coverage
    # gate measures src coverage and never needed the tsc sweep.
    env:
      MELITE_TIER_DELEGATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "Build (battery order law: build-plane first, then walls)"
        run: pnpm run build
      - name: Coverage gate
        run: pnpm run test:coverage

  tiers:
    name: tiers (e2e self-skip + expected + bench + snapshot + web replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Real-API e2e (keyless self-skip)
        run: pnpm run test:e2e
      - name: Build (expected tier's built arms run against real output)
        run: pnpm run build
      - name: Lib sync (a fresh build reproduces the committed lib/)
        run: |
          # GT-06 (the round-5 gate audit): git diff is BLIND to
          # untracked files — a build emitting a brand-new lib path
          # rode this gate green. The porcelain sweep sees both.
          git diff --exit-code -- '**/lib/**' || {
            echo "CI FAIL: lib/ drifted from a fresh build — the artifact must land in the same commit as the src";
            git status --porcelain -- '**/lib/**';
            exit 1;
          }
          UNTRACKED="$(git status --porcelain -- '**/lib/**')"
          if [ -n "$UNTRACKED" ]; then
            echo "CI FAIL: a fresh build emitted UNTRACKED lib files the diff cannot see:"
            echo "$UNTRACKED"
            exit 1
          fi
      - name: Owner-local expected output
        run: pnpm run test:expected
      - name: Benchmarks
        run: pnpm run test:bench
      - name: Snapshot replay (read-only)
        run: DSH_SNAPSHOT=replay pnpm run test:snapshot
      - name: Web snapshot replay (read-only)
        run: DSH_SNAPSHOT=replay pnpm run test:web
      # THE BROWSER-WALL CI SEAT (roadmap §9, fresh-checkout repair
      # 2026-09-25): the studio lane boots from the TRACKED portable
      # seed (packages/web/melite-card-view/e2e/profile-seed —
      # relative links, deps materialized at boot) and runs in
      # REQUIRE mode: a missing prerequisite FAILS the seat, a
      # self-skip can never green it. Playwright browsers first.
      - name: Install Playwright browsers (the studio lane's own)
        run: pnpm --filter @melite-plugin/dsh-card-view exec playwright install --with-deps chromium
      - name: Studio browser wall (tracked seed, REQUIRE mode)
        run: E2E_STUDIO_REQUIRE=1 pnpm run test:e2e:studio

  # No walls job: the wall suites run inside `unit` (root vitest
  # node project). Live GPU inference stays opt-in locally — it needs
  # the standing gateway + ComfyUI and is never CI's to spend.

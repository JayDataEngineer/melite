name: Stage probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose audio-sfx asset is staged'
        required: true
        default: 'v0.1.5-pre-alpha'

permissions:
  contents: read

jobs:
  stage:
    name: Stage one deferred package with the granular token
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download the probe asset and stage it
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -x
          gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'melite-audio-sfx-*.tgz' --dir dist --clobber
          ls -l dist
          # Stage publish needs no 2FA by npm's contract; the probe answers
          # whether the granular token's stage lane bypasses the account
          # meter that throttles direct publish.
          npm version
          npm stage publish ./dist/melite-audio-sfx-0.1.5-pre-alpha.tgz --tag next

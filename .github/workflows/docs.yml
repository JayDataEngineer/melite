name: Docs

on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'website/**', 'scripts/project-docs.mjs', '.github/workflows/docs.yml']
  workflow_dispatch:

# THE DOCS SEAT (the DSH docs-pages.yml shape): the site is a projection
# of repository Markdown — website/docs.mjs is the public allowlist,
# scripts/project-docs.mjs the projector, VitePress the builder. DOCS_BASE
# comes from actions/configure-pages, never a hardcoded repo name. DEVIATION
# from DSH's dispatch-only, release-snapshot publication: this seat also
# listens to push, because melite is pre-release and the site must track
# the tree; revisit to dispatch-only at the first tagged release.
# First enable Pages once: Settings → Pages → Source: "GitHub Actions".
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: project + build (VitePress)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm run docs:build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.dist

  deploy:
    name: deploy (GitHub Pages)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

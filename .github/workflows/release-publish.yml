# Publish the melite release sequence to npm. This workflow is manual-only
# (workflow_dispatch) and intentionally does not listen to pull_request or
# push: publication must always be an explicit, reviewed act from a v* tag,
# and it must never appear as a PR check. The pack job mints from the tag
# (build, pack, hygiene strip, payload/entry/executability gates, manifest
# digests, Sigstore build-provenance attestations); the publish job uploads
# exactly those gated bytes — it has no build step.
name: Release publish (melite)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mint and publish (must point at a commit)'
        required: true
        type: string
      dist:
        description: 'Tarball source: mint in CI, or download the release assets'
        required: false
        default: 'mint'
        type: choice
        options:
          - mint
          - release-assets
      attempts:
        description: 'Re-arm budget: walks left before the sequence stops itself'
        required: false
        default: 8
        type: number

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  pack:
    name: Mint gated npm tarballs
    if: inputs.dist == 'mint'
    runs-on: ubuntu-24.04
    # The minted tarballs get a Sigstore build-provenance attestation
    # (actions/attest@v4, SLSA predicate): each tarball's sha256 is bound
    # to this repo, workflow, and tag commit in the transparency log.
    # This is the provenance the token publish lane cannot mint — npm's
    # own provenance needs OIDC trusted publishing, which refuses
    # first-publish names (the permission-404 recorded in the publish
    # job below). Verified by anyone:
    #   gh attestation verify <tarball> --repo "$GITHUB_REPOSITORY"
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Complete history: the release scripts read tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Mint (build + pack + gates + publish rewrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release-artifacts.mjs mint --tag ${{ inputs.tag }} --out dist/npm

      - uses: actions/attest@v4
        with:
          # The publishable set only: the mint leaves private vendor-tier
          # tarballs (no melite- prefix, upstream licenses) in the same
          # directory, and their digests do not belong in the public
          # transparency log. ~98 subjects fit the action's 1024 cap;
          # a single attestation carries all of them.
          subject-path: dist/npm/melite-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: melite-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  fetch:
    name: Fetch the release assets (the gated mint)
    if: inputs.dist == 'release-assets'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The tag's release assets carry the exact sha256-gated bytes the
      # local mint produced — publishing them skips the CI re-mint while
      # uploading the same tarballs the rehearsal validated.
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir dist/npm --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: melite-npm-tarballs
          path: dist/npm/*
          if-no-files-found: error
          retention-days: 7

  rehearse:
    name: Cold-consumer rehearsal
    needs: [pack, fetch]
    # The dist lanes are exclusive: exactly one of pack/fetch runs, so
    # a skipped sibling must not skip the sequence (needs propagates
    # skips) — each lane is judged on its own result.
    if: >-
      !cancelled() &&
      (needs.pack.result == 'success' || needs.pack.result == 'skipped') &&
      (needs.fetch.result == 'success' || needs.fetch.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      # VERIFIER FRESHNESS: the rehearsal checks out the dispatch ref,
      # not the tag — receipts are verifiers and must be allowed to
      # improve over a frozen tag (the client-carriage fix is the
      # first case). The publish job below stays pinned to the tag:
      # only a verifier may be newer than the bytes it judges.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: melite-npm-tarballs
          path: dist/npm

      - name: Rehearsal (fresh container, official install, 10 receipts)
        run: node tools/release-rehearsal.mjs --dist dist/npm

  publish:
    name: Publish to npm
    needs: rehearse
    if: ${{ !cancelled() && needs.rehearse.result == 'success' }}
    runs-on: ubuntu-24.04
    # The account-level publish limiter admits roughly one batch per
    # window (~2h observed); the walk retries in-place, sleeping the
    # window off — every pass skips versions already on the registry.
    timeout-minutes: 350
    # Required reviewers and the allowed tags live on the environment; this
    # is the only job in the sequence that can write to the registry.
    environment: npm-publish
    concurrency:
      group: Release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      # SELF-RE-ARM: an incomplete walk re-dispatches this workflow for
      # the next account window; the attempts input is the runaway cap.
      actions: write
    steps:
      # Checkout and install carry the release scripts only. There is no
      # build step: publication uploads the bytes the pack job produced.
      # ref: the publish script that runs must be the tag's own — a
      # default-branch checkout could run a changed publisher over the
      # minted bytes.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: melite-npm-tarballs
          path: dist/npm

      - name: Publish tarballs
        env:
          # The token lane mints NEW package names — trusted publishing
          # can only cover names with an existing registry-side
          # connection, and every first-publish name in this set has
          # none (the OIDC walk refused the first one with a
          # permission-404). The runner IP and the fresh token start
          # outside whatever window throttled the local lane.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if node tools/publish-npm.mjs --from dist/npm; then
              echo "publish walk complete on attempt $i"; exit 0
            fi
            echo "walk died on attempt $i — sleeping 25m off the account window"
            sleep 1500
          done
          echo "publish walk did not complete in 8 attempts"; exit 1

      - name: Re-arm the walk (the set is still incomplete)
        if: ${{ failure() && inputs.attempts > 1 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The ${{ inputs.attempts }} substitution must sit INSIDE the
          # arithmetic — $(({{ ... }})) leaves the literal braces for
          # bash, whose operand error silently killed every re-arm.
          gh workflow run release-publish.yml --ref "$GITHUB_REF_NAME" \
            -f tag="${{ inputs.tag }}" -f dist="${{ inputs.dist }}" \
            -f attempts=$((${{ inputs.attempts }} - 1))
          echo "re-armed: $((${{ inputs.attempts }} - 1)) walks left"

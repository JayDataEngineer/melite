# W4 FAILURE-PATH overlay: same plugin, gateway pointed at a dead port.
# Boots its own instance on 3086 (3085 is taken by an unrelated process on this
# machine) so the live gateway (:33081) is untouched; GET /melite-gallery/runs must
# answer 502 with the proxy's gateway_unreachable body — the exact payload the
# gallery view renders as its error state.
#
# Boot:
#   DSH_HOME=/tmp/melite-dsh-home dsh --profile web \
#     --patch $MELITE_REPO/dsh/melite-gallery/test-overlay-failure.yml --port 3086

- id: webserver
  config:
    host: 127.0.0.1
    port: 3086

- insert:
    - id: melite-gallery
      name: '@melite-plugin/dsh-gallery'
      config:
        gatewayUrl: 'http://localhost:33999'
        timeoutMs: 1500

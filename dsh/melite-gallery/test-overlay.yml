# W4 melite-gallery isolated-boot overlay (port 3084; never the live :3080).
#
# ONE dual-face row serves BOTH halves:
#   - host half: the loader imports the package (exports "." -> lib/index.js),
#     which registers /melite-gallery/runs + /melite-gallery/artifact on webServer;
#   - client half: dsh-client-modules resolves the row name as a PACKAGE NAME
#     (require.resolve('<name>/package.json') from the profile tree), reads the
#     dsh.client declaration, and serves exports['./client'] at
#     /plugins/@melite-plugin/dsh-gallery/client.js + lists it in __DSH_BOOT__.
#
# A file-path name (W0 style) cannot carry the client half — resolution of
# '<path>/package.json' fails and the bundle never enters the boot graph.
# The package is linked into the isolated profile with:
#   DSH_HOME=/tmp/melite-dsh-home dsh plugin --profile web add link:<pkg dir>
#
# Boot:
#   DSH_HOME=/tmp/melite-dsh-home dsh --profile web \
#     --patch $MELITE_REPO/dsh/melite-gallery/test-overlay.yml --port 3084

- id: webserver
  config:
    host: 127.0.0.1
    port: 3084

- insert:
    - id: melite-gallery
      name: '@melite-plugin/dsh-gallery'
      config:
        gatewayUrl: 'http://localhost:33081'

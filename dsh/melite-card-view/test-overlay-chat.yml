# W3 STRETCH overlay (disposable): same two ray-card-view rows as
# test-overlay.yml PLUS the ray-tools host row, so a real chat turn can call
# the pipeline_start wire tool and the keyed card can render against it.
# Port 3087; never touches the live :3080 or the verified :3083 instance.
#
#   DSH_HOME=/tmp/ray-dsh-home dsh --profile web \
#     --patch /home/user/Documents/programs/ray/dsh/ray-card-view/test-overlay-chat.yml --port 3087

- id: webserver
  config:
    host: 127.0.0.1
    port: 3087

- insert:
    - id: ray-card-view-host
      name: /home/user/Documents/programs/ray/dsh/ray-card-view/lib/index.js
      config:
        gatewayUrl: 'http://localhost:33081'
    - id: ray-tools
      name: /home/user/Documents/programs/ray/dsh/ray-tools/lib/index.mjs
      config:
        gatewayUrl: 'http://localhost:33081'
    - id: ray-card-view-client
      name: '@ray-plugin/dsh-card-view'
      config:
        clientRowOnly: true

# W2 ray-tools boot-verification overlay — disposable port so the live GUI
# (:3080) is never touched. Entry paths are ABSOLUTE: the loader resolves
# relative names against the profile dir (~/.dsh/profiles/web/), not this
# file (W0-VERIFICATION.md failure-path #1).
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082

- insert:
    - id: ray-tools
      name: /home/user/Documents/programs/ray/dsh/ray-tools/lib/index.mjs
      config:
        gatewayUrl: http://localhost:33081

# Melite overlay — inference.cpp local copy (2026-08-30; consolidated
# 2026-09-01). ALL plugins live in inference.cpp/dsh/, the editor bundle
# is built from inference.cpp/web/editor + inference.cpp/plugins, and
# the gateway is localhost:33081 (canonical-port law, 2026-09-02: the
# inference-gateway systemd unit, every skill, and the ray workspace
# deck default all target 33081 — 18090 is RETIRED; the drift between
# this config (18090) and the unit (33081) WAS the catalog-502
# incident). NO RAY DEPENDENCY — and since the
# 2026-09-01 consolidation that is actually true: the web profile
# (~/.dsh/profiles/web/package.json) links every @melite-plugin/* package
# HERE (they previously linked ../ray/dsh/*, making ray the hidden
# source of truth for the whole card UI). The card-deck serves /editor
# from inference.cpp/web/editor/dist (deck lib → ../../../web/editor/dist).

- insert:
    - id: infer-hello
      name: /home/user/Documents/programs/active/inference.cpp/dsh/melite-hello/lib/index.mjs
      config:
        greeting: 'Inference lane online'
    - id: infer-tools
      name: /home/user/Documents/programs/active/inference.cpp/dsh/melite-tools/lib/index.mjs
      config:
        gatewayUrl: http://localhost:33081
    - id: infer-card-view-host
      name: /home/user/Documents/programs/active/inference.cpp/dsh/melite-card-view/lib/index.js
      config:
        gatewayUrl: 'http://localhost:33081'
    - id: infer-card-view-client
      name: '@melite-plugin/dsh-card-view'
      config:
        clientRowOnly: true
    - id: infer-gallery-host
      name: /home/user/Documents/programs/active/inference.cpp/dsh/infer-gallery/lib/index.js
      config:
        gatewayUrl: 'http://localhost:33081'
    - id: infer-media
      name: '@infer-media/dsh-media'
      config:
        gateways:
          - 'http://localhost:33081'
    - id: infer-card-deck
      name: '@melite-plugin/dsh-card-deck'
      config:
        gatewayUrl: 'http://localhost:33081'

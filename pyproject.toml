# The estate python — the gateway's entire third-party surface.
#
# PROVISIONING LAW: this env is the estate's OWN (resilience law —
# the gateway must survive comfy torch chaos, so it never shares a
# bloodstream with the renderer by default). Power users MAY fold
# these deps into a comfy env; the surface is pydantic-only, so
# folding is safe. uv lock pins; uv sync materializes.
[project]
name = "melite-gateway"
version = "0.1.0"
description = "inference.cpp estate gateway (py/ + plugin compose)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13"]

# The MANAGEMENT environment (opt-in group; the default env stays
# pydantic-only). comfy-mcp is the management plane's python package —
# its tools are called IN-PROCESS by tools/provision.py. The comfy
# BINARY is NOT a pip dep: it is deployment-provided and routed by
# comfy-mcp via COMFY_BIN/PATH (portability law — this machine's PATH
# `comfy` is deployment glue into the serving container).
[dependency-groups]
management = ["comfy-mcp>=0.10.0", "pyyaml>=6"]

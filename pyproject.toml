# The estate python — the gateway's entire third-party surface.
#
# ONE FLOW (operator order, 2026-09-03): the BASE env IS the comfyui
# management plane. There is no opt-in group, no second env — the
# system does not run without comfy-mcp, so comfy-mcp is base. This
# env installs ComfyUI (comfy-cli), manages it (comfyui-manager's
# cm_cli), drives it (comfy-mcp), composes for it (comfy-script) and
# serves MCP (fastmcp + starlette). uv lock pins; uv sync materializes.
[project]
name = "melite-gateway"
version = "0.1.0"
description = "inference.cpp estate gateway (py/ + plugin compose)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    # composition engine: upstream comfy-script builds node classes
    # from the pinned object_info; co_script is our DRY-primitives
    # layer over it (pin discipline, require_nodes gate, blocks,
    # renderer registry). (comfy-script under-declares its runtime
    # imports; nest_asyncio2 / aiohttp / networkx are its real
    # transitive surface.)
    "comfy-script>=0.6",
    "nest_asyncio2>=1.0",
    "aiohttp>=3.9",
    "networkx>=3",
    "pillow>=10",
    # management plane: comfy-mcp (THE engine boundary — the system
    # does not run without it), comfyui-manager (v4 package form:
    # cm_cli, the install rail), comfy-cli (install/routing python),
    # fastmcp + starlette (MCP serving), pyyaml (manifests).
    "comfy-mcp>=0.10.0",
    "comfyui-manager",
    "comfy-cli",
    "fastmcp",
    "starlette",
    "pyyaml>=6",
    # agent harness: the python SDK + bundled dsh runtime (the SERVER
    # mount). Recipe: plugins/harness/dsh/provisioner, materialized
    # data/runtime/dsh-harness-home. Exact pin — pre-release line;
    # bumps are deliberate orders (bundled runtime ships in the wheel:
    # no Node.js, no pnpm needed to serve).
    "deepseek-harness-sdk==0.1.2a3",
    "mypy>=1.14",
]

# ── TYPING WALL (operator order 2026-09-04: "you cannot silently skip
# out on strongly typed code") ──────────────────────────────────────
# strict mypy over the typed-contract surface; the target list lives
# in tests/walls/suites/test_typing.py and only GROWS (a module joins when it is
# fully annotated; nothing ever leaves). follow_imports=silent keeps
# not-yet-migrated dependencies from blocking the wall while their
# imports still resolve.
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
follow_imports = "silent"
# the compose primitives ride sys.path at runtime (the pattern's lazy
# loader); mypy resolves the same roots. explicit_package_bases keeps
# module names anchored to those roots — compose/presets.py is
# "presets" whether targeted by path or imported by sibling cards
mypy_path = "py:plugins/engines/comfyui/compose"
explicit_package_bases = true

# pydantic plugin discipline (PYTHON SHAPE rung 2): construction is
# the validation door — no runtime mutation of frozen models
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

# ── TEST PLANE (operator order 2026-09-04: "we should probably add
# pytest") ──────────────────────────────────────────────────────────
# pytest is the RUNNER; the script-style wall suites stay script-style
# (their check() discipline and exit codes ARE the contract — pytest
# wraps them as subprocess walls, never rewrites them). The dev group
# is the only dependency group (the management plane stays base —
# PROVISIONING LAW).
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# tests/ layout: unit/ = no server, routes/ = live gateway (skips when
# down), integration/ = real inference (-m gpu, deselected by default),
# walls/ = the pytest-side orchestrator (test_walls.py) + suites/ (a
# mix of native pytest tests and script-style wall suites; conftest.py
# keeps the unconverted script-style suites OUT of collection),
# dev_dsh/ = the DSH harness gate ladder (own runner), timeline/ = the
# h3 timeline suite (own runner). The goldens live in golden_http/ +
# golden_compose/.
testpaths = ["tests/unit", "tests/routes", "tests/integration", "tests/walls"]
# repo root on sys.path: unit suites import shared factories across
# test files (tests.unit.runtime.conftest) — namespace packages
# resolve only with the root importable (the README runner
# `uv run pytest` does not prepend CWD the way `python -m pytest` does)
pythonpath = ["."]
markers = [
    "gpu: real inference through the queue (opt in: pytest -m gpu)",
]
addopts = "-m 'not gpu' -q"

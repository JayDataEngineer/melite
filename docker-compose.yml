# ONE bootstrap path, two wrappers: bare metal runs bootstrap.py directly;
# docker runs the same bootstrap inside images/containers. No parallel
# provisioning exists anywhere.

services:
  # -- inference.cpp gateway (C++ server; image builds via bootstrap.py) --
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18090:18090"   # HTTP API
      - "18091:18091"   # WebSocket
    volumes:
      - model-cache:/root/.cache/inference.cpp
    environment:
      - HOME=/root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18090/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      comfyui:
        condition: service_healthy

  # -- ComfyUI executor (self-bootstraps extensions + models on boot) --
  comfyui:
    build:
      context: .
      dockerfile: infra/comfyui/Dockerfile.comfyui
    ports:
      - "18465:18465"
    volumes:
      - comfyui-models:/root/ComfyUI/models
      - .:/opt/inference-src:ro          # the bootstrap + declarations + patches
      - comfyui-input:/root/ComfyUI/input
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - COMFYUI_DIR=/root/ComfyUI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18465/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  model-cache:
  comfyui-models:
  comfyui-input:

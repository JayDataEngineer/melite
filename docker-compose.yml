version: "3.8"

services:
  # -- inference.cpp server (the HTTP/WS API) --
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18090:8080"   # HTTP API
      - "18091:8081"   # WebSocket
    volumes:
      - model-cache:/root/.cache/inference.cpp
      - ./plugins:/opt/inference/plugins:ro
      - ./custom_nodes:/opt/inference/custom_nodes:ro
      - ./skills:/opt/inference/skills:ro
    environment:
      - HOME=/root
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      comfyui:
        condition: service_healthy

  # -- ComfyUI (the GPU engine) --
  comfyui:
    build:
      context: .
      dockerfile: infra/comfyui/Dockerfile.comfyui
    ports:
      - "18465:18465"
    volumes:
      - comfyui-models:/root/ComfyUI/models
      - ./plugins:/tmp/melite-plugins:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18465/system_stats"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  model-cache:
  comfyui-models:

name: krea-txt2img
description: "Text-to-image through the comfyui engine (krea-2 on the container). Graph pinned from the live gateway /v1/compose; prompt/seed injected at run time."

nodes:
  - id: generate
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/krea-txt2img/workflow.json","out_dir":"./output","timeout_s":300,"inject":{"CLIPTextEncode.0.text":"$prompt","KSampler.0.seed":"$seed"}}

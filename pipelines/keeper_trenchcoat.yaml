output_dir: ./data/test-output/pipelines/pipeline_keeper_trenchcoat

shared:
  comfy_url: http://127.0.0.1:18465

steps:
  - family: generate_image
    phase: concept
    title: "Concept - trench coat"
    consumes: [comfy_url]
    outputs: [asset_image]
    params:
      model: z-image
      seed: 42
      output_artifact: asset_image
      prompt: >-
        worn leather travel trench coat, weathered brown-grey canvas, heavy fabric,
        brass buckles, repaired patches, frayed hem, desert-dusk palette, bone-white
        cloth accents, practical traveler garment, full body garment on invisible
        mannequin, product photography, neutral grey background, detailed texture,
        fantasy RPG equipment
      negative_prompt: >-
        text, watermark, busy background, drop shadow, scene, multiple
        objects, cropped, human, body, skin

  - family: trellis_native
    phase: mesh
    title: "Mesh - trench coat"
    consumes: [comfy_url]
    inputs: [asset_image]
    outputs: [asset_glb]
    params:
      model: trellis_native
      seed: 42
      image_artifact: asset_image
      resolution: "512"
      atlas_px: 1024
      dump_post: enable
      output_artifact: asset_glb

  - family: trellis_native_replay
    phase: budget
    title: "Budget - trench coat"
    consumes: [comfy_url]
    inputs: [asset_glb]
    outputs: [prop_glb]
    params:
      model: trellis_native_replay
      faces_target: 5000
      atlas: 1024
      glb_artifact: asset_glb
      dump_artifact: asset_glb_dump
      output_artifact: prop_glb

  - family: render_glb_views
    phase: review
    title: "Views - trench coat"
    consumes: [comfy_url]
    inputs: [prop_glb]
    outputs: [views]
    params:
      model: render_glb_views
      glb_artifact: prop_glb
      output_artifact: views

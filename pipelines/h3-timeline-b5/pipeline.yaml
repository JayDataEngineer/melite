name: h3-timeline-b5
description: "H3 timeline final batch: 2 windows, chains from slot 12; total 18 windows = 93.0s -> trim 90.0s"

nodes:
  - id: window1
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window1_load.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt","MiniMaxH3MotionContextLoadLatent.0.clip_index":16,"MiniMaxH3MotionContextSaveLatent.0.clip_index":17},"fps":24,"mux":1}

  - id: window2
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window2_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt2","MiniMaxH3MotionContextLoadLatent.0.clip_index":17,"MiniMaxH3MotionContextSaveLatent.0.clip_index":18},"fps":24,"mux":1}

  - id: stitch
    type: ffmpeg_concat
    params: {"trim_heads":[0, 0], "match_level":true}
    input_from:
      - window1.video_0
      - window2.video_0

name: img-to-3d
description: "Unity-style asset chain: text -> krea concept image -> TRELLIS GLB mesh, both gens through the comfyui engine. The concept PNG is uploaded to the container and wired into LoadImage."

nodes:
  - id: concept
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/img-to-3d/krea-workflow.json","out_dir":"./output","timeout_s":300,"inject":{"CLIPTextEncode.0.text":"$prompt","KSampler.0.seed":"$seed"}}

  - id: mesh
    type: comfyui
    input_from:
      - concept.image_0
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/img-to-3d/trellis-workflow.json","out_dir":"./output","timeout_s":900,"inject":{"LoadImage.0.image":"$image_0","TrellisCppNative.0.seed":"$seed"}}

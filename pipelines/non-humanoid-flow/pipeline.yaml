name: non-humanoid-flow
api: true
description: "Creature/prop pipeline — concept image → TRELLIS mesh → decimate → rig (optional) → 8 review views"

steps:
  - id: concept
    type: image-gen
    plugin: comfyui
    description: "Generate or provide a concept image"

  - id: mesh
    type: trellis_native
    plugin: trellis2
    description: "Generate 3D mesh from concept"

  - id: clean
    type: clean_mesh
    plugin: trellis2
    description: "QEM decimate to face budget"

  - id: rig
    type: creature_rig
    plugin: trellis2
    description: "Apply anyCreature skeleton rig (optional)"
    optional: true

  - id: views
    type: render_views
    plugin: comfyui
    description: "Render 8 views for quality gate"

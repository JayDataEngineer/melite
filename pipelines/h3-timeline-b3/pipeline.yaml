name: h3-timeline-b3
description: "H3 timeline batch b3: chains from prior batch via motion-context slot 6"

nodes:
  - id: window1
    type: comfyui
    # chains from prior batch's last slot via h3_motion_context clip slot 6
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window1_load.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt","MiniMaxH3MotionContextLoadLatent.0.clip_index":8,"MiniMaxH3MotionContextSaveLatent.0.clip_index":9},"fps":24,"mux":1}

  - id: window2
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window2_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt2","MiniMaxH3MotionContextLoadLatent.0.clip_index":9,"MiniMaxH3MotionContextSaveLatent.0.clip_index":10},"fps":24,"mux":1}

  - id: window3
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window3_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt3","MiniMaxH3MotionContextLoadLatent.0.clip_index":10,"MiniMaxH3MotionContextSaveLatent.0.clip_index":11},"fps":24,"mux":1}

  - id: window4
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window4_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt4","MiniMaxH3MotionContextLoadLatent.0.clip_index":11,"MiniMaxH3MotionContextSaveLatent.0.clip_index":12},"fps":24,"mux":1}

  - id: stitch
    type: ffmpeg_concat
    params: {"trim_heads":[0, 0, 0, 0], "match_level":true}
    input_from:
      - window1.video_0
      - window2.video_0
      - window3.video_0
      - window4.video_0

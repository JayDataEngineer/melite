name: h3-timeline
description: "H3 timeline: chained windows with motion-context seams; concat trims+level-matches joins"

nodes:
  - id: window1
    type: comfyui
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window1_t4.json","out_dir":"./output","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt"},"fps":24,"mux":1}

  - id: window2
    type: comfyui
    # chains from window1 via h3_motion_context clip slot 1 (saved in-graph)
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window2_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt2"},"fps":24,"mux":1}

  - id: window3
    type: comfyui
    # chains from window2 via h3_motion_context clip slot 2
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window3_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt3"},"fps":24,"mux":1}

  - id: window4
    type: comfyui
    # chains from window3 via h3_motion_context clip slot 3
    params: {"server_url":"http://127.0.0.1:18465","workflow_file":"../pipelines/h3-timeline/window4_t4.json","out_dir":"./output","input_dir":"/opt/ComfyUI/input","timeout_s":1800,"inject":{"KSampler.0.seed":"$seed","MiniMaxH3ImageToVideo.0.prompt":"$prompt4"},"fps":24,"mux":1}

  - id: stitch
    type: ffmpeg_concat
    # seam law: pack Trim removes pinned heads in-graph; join loudness match here
    params: {"trim_heads":[0, 0, 0, 0], "match_level":true}
    input_from:
      - window1.video_0
      - window2.video_0
      - window3.video_0
      - window4.video_0

name: h3-timeline-v7
description: 'PlagueKind v7 translation: SLA sparse attention + mode bypassers + FSR
  sharpen + FILM interpolation, latent-chained windows (his single-window flow, our
  N-window chaining)'
nodes:
- id: window1
  type: comfyui
  params:
    server_url: http://127.0.0.1:18465
    workflow_file: ../pipelines/h3-timeline/window1_v7.json
    out_dir: ./output
    timeout_s: 1800
    inject: {KSampler.0.seed: $seed, MiniMaxH3ImageToVideo.0.prompt: $prompt1, RayH3SaveLatentTail.0.path: $tailpath1}
    fps: 24
    mux: 1
- id: window2
  type: comfyui
  params:
    server_url: http://127.0.0.1:18465
    workflow_file: ../pipelines/h3-timeline/window2_v7.json
    out_dir: ./output
    timeout_s: 1800
    inject: {KSampler.0.seed: $seed, MiniMaxH3ImageToVideo.0.prompt: $prompt2, RayH3SaveLatentTail.0.path: $tailpath2,
      RayH3ChainLatentAV.0.tail_path: $tailpath1}
    fps: 24
    mux: 1
- id: window3
  type: comfyui
  params:
    server_url: http://127.0.0.1:18465
    workflow_file: ../pipelines/h3-timeline/window3_v7.json
    out_dir: ./output
    timeout_s: 1800
    inject: {KSampler.0.seed: $seed, MiniMaxH3ImageToVideo.0.prompt: $prompt3, RayH3SaveLatentTail.0.path: $tailpath3,
      RayH3ChainLatentAV.0.tail_path: $tailpath2}
    fps: 24
    mux: 1
- id: window4
  type: comfyui
  params:
    server_url: http://127.0.0.1:18465
    workflow_file: ../pipelines/h3-timeline/window4_v7.json
    out_dir: ./output
    timeout_s: 1800
    inject: {KSampler.0.seed: $seed, MiniMaxH3ImageToVideo.0.prompt: $prompt4, RayH3SaveLatentTail.0.path: $tailpath4,
      RayH3ChainLatentAV.0.tail_path: $tailpath3}
    fps: 24
    mux: 1
- id: stitch
  type: ffmpeg_concat
  params:
    trim_heads: [0, 0, 0, 0]
    match_level: true
  input_from: [window1.video_0, window2.video_0, window3.video_0, window4.video_0]

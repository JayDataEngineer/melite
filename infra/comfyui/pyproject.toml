# MANAGED ComfyUI runtime — uv-locked deps + pinned core checkout.
#
# PROVISIONING LAW: the estate VERIFIES a user's ComfyUI (BYO,
# default) and never installs one — EXCEPT in "managed" deployments,
# where the estate is its own most convenient customer.
#
# CORE SHAPE (learned live, flip day 2026-09-03): ComfyUI core at the
# audited ref is NOT a pip package — its pyproject has no build
# system and no packaging config (setuptools auto-discovery refuses
# the six top-level packages). Comfy-Org ships core as a git
# checkout (comfy-cli does exactly that). So managed core = a PINNED
# git checkout (infra/comfyui/core.pin — version hops are deliberate
# pin bumps), and THIS project locks every real runtime dep (core's
# own requirements.txt, verbatim ranges) as wheels. Determinism:
# uv.lock pins the deps; core.pin pins the source. Never clone
# "latest" — the pin is the truth.
#
# Manager note (flip order): install_node drives ComfyUI-Manager's
# cm_cli IN the target instance — the v4 PACKAGE form is the rail,
# the legacy custom_nodes clone does not count (live-probed against
# the ray-era image). The management PLANE is still ONE (comfy-mcp);
# Manager ships here only as its machinery.
#
# NOT included, deliberately:
#   - weights — never in the env; extra_model_paths.yaml (generated
#     from the endpoint config's model_base_path) points at the
#     deployment's persistent storage. Switching comfyui versions
#     never moves a gigabyte.
[project]
name = "melite-comfyui-runtime"
version = "0.1.0"
description = "managed ComfyUI runtime for the inference.cpp estate (BYO deployments need none of this)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core runtime deps (requirements.txt @ core.pin, verbatim ranges)
    "comfyui-frontend-package>=1.51.9",
    "comfyui-workflow-templates>=0.11.50",
    "comfyui-embedded-docs>=0.5.10",
    "torch",
    "torchsde",
    "torchvision",
    "torchaudio",
    "numpy>=1.25.0",
    "einops",
    "transformers>=4.50.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "Pillow",
    "scipy",
    "tqdm",
    "psutil",
    "alembic",
    "SQLAlchemy>=2.0.0",
    "filelock",
    "av>=17.0.0",
    "comfy-kitchen>=0.2.31",
    "comfy-aimdo>=0.4.15",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    # non-essential but declared by core
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    "comfy-angle",
    # management rails
    "comfy-cli>=1.14",
    "comfyui-manager>=4.0",
    # authored runtime lib: PipelinePatcher — the packs' custom nodes
    # import it (installed-first, _vendor fallback for BYO envs)
    "melite-model-base",
    # pack-lane runtime deps (canary-proven 2026-09-04, GPU sweep):
    # kimodo's 8-bit text-encoder path + its motion lib; tts/voice-
    # lock's qwen engine (HARD-PINS transformers 4.57.3 — kimodo runs
    # live-proven on it; the /opt/kimodo pyproject's 5.1.0 pin is
    # conservative); the poser chain's mesh work. The audio lane also
    # runs its DiT EAGER on this stack (AUDIOCORE_SFX_EAGER=1 — the
    # torch 2.11 inductor segfault, see melite-audio-nodes eb18e35).
    "bitsandbytes==0.50.2",
    "motion-correction",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "trimesh>=5.0",
    # the poser chain's NATIVE anny engine (operator order, 2026-09-06:
    # "you are rendering GLB and not native ANNY... that is why it is
    # low quality") — /poser/skin/mesh?identity_model=anny builds
    # SOMALayer(identity_model_type="anny") and refuses without this;
    # the Shape band's live preview is the native anny figure.
    "py-soma-x[anny]",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
melite-model-base = { path = "../../vendor/comfyui_extensions/melite-model-base" }
# kimodo's motion lib, VENDORED (Apache-2.0): the PyPI 0.2.2 pins a
# dead stack (scikit-image==0.21 + matplotlib==3.7.2 + astropy==6.0.0
# — none ship cp312 wheels), so a --frozen sync built them from
# source and died under Cython 3 on every fresh machine; the live
# estate's working venv runs THIS tree's 1.0.0 (torch+numpy only,
# CMake C++ ext — cmake + g++ are provisioning prerequisites)
motion-correction = { path = "../../vendor/comfyui_extensions/MotionCorrection" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

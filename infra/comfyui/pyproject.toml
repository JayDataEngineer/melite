# MANAGED ComfyUI runtime — uv-locked deps + pinned core checkout.
#
# PROVISIONING LAW: the estate VERIFIES a user's ComfyUI (BYO,
# default) and never installs one — EXCEPT in "managed" deployments,
# where the estate is its own most convenient customer.
#
# CORE SHAPE (learned live, flip day 2026-09-03): ComfyUI core at the
# audited ref is NOT a pip package — its pyproject has no build
# system and no packaging config (setuptools auto-discovery refuses
# the six top-level packages). Comfy-Org ships core as a git
# checkout (comfy-cli does exactly that). So managed core = a PINNED
# git checkout (infra/comfyui/core.pin — version hops are deliberate
# pin bumps), and THIS project locks every real runtime dep (core's
# own requirements.txt, verbatim ranges) as wheels. Determinism:
# uv.lock pins the deps; core.pin pins the source. Never clone
# "latest" — the pin is the truth.
#
# Manager note (flip order): install_node drives ComfyUI-Manager's
# cm_cli IN the target instance — the v4 PACKAGE form is the rail,
# the legacy custom_nodes clone does not count (live-probed against
# the ray-era image). The management PLANE is still ONE (comfy-mcp);
# Manager ships here only as its machinery.
#
# NOT included, deliberately:
#   - weights — never in the env; extra_model_paths.yaml (generated
#     from the endpoint config's model_base_path) points at the
#     deployment's persistent storage. Switching comfyui versions
#     never moves a gigabyte.
[project]
name = "melite-comfyui-runtime"
version = "0.1.0"
description = "managed ComfyUI runtime for the inference.cpp estate (BYO deployments need none of this)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # core runtime deps (requirements.txt @ core.pin, verbatim ranges;
    # the five core pins are == in core's own spelling — the lock then
    # resolves to the exact set 0.38.0 was tested with, not float-latest)
    "comfyui-frontend-package==1.53.6",
    "comfyui-workflow-templates==0.11.70",
    "comfyui-embedded-docs==0.5.12",
    "torch",
    "torchsde",
    "torchvision",
    # torchaudio: core's requirements.txt dropped it at 0.38.0; the
    # estate keeps it anyway (audit 005/E1, 2026-10-22) — the audio
    # packs import torchaudio.functional live (melite-audio-nodes
    # loudness.py, the moss pipelines, MiniMaxH3Mod's resample).
    "torchaudio",
    "numpy>=1.25.0",
    "einops",
    "transformers>=4.50.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "Pillow",
    "scipy",
    "tqdm",
    "psutil",
    "alembic",
    "SQLAlchemy>=2.0.0",
    "filelock",
    "av>=17.0.0",
    "comfy-kitchen==0.2.36",
    "comfy-aimdo==0.5.5",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    # non-essential but declared by core
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    "comfy-angle",
    # management rails
    "comfy-cli>=1.14",
    "comfyui-manager>=4.0",
    # authored runtime lib: PipelinePatcher — the packs' custom nodes
    # import it (installed-first, _vendor fallback for BYO envs)
    "melite-model-base",
    # pack-lane runtime deps (canary-proven 2026-09-04, GPU sweep):
    # kimodo's 8-bit text-encoder path + its motion lib; tts/voice-
    # lock's qwen engine (HARD-PINS transformers 4.57.3 — kimodo runs
    # live-proven on it; the /opt/kimodo pyproject's 5.1.0 pin is
    # conservative); the poser chain's mesh work. The audio lane also
    # runs its DiT EAGER on this stack (AUDIOCORE_SFX_EAGER=1 — the
    # torch 2.11 inductor segfault, see melite-audio-nodes eb18e35).
    "bitsandbytes==0.50.2",
    "motion-correction",
    "qwen-tts==0.1.1",
    "transformers==4.57.3",
    "trimesh>=5.0",
    # the poser chain's NATIVE anny engine (operator order, 2026-09-06:
    # "you are rendering GLB and not native ANNY... that is why it is
    # low quality") — /poser/skin/mesh?identity_model=anny builds
    # SOMALayer(identity_model_type="anny") and refuses without this;
    # the Shape band's live preview is the native anny figure.
    "py-soma-x[anny]",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# melite-model-base at a frozen rev (2026-10-15, F1's other half):
# the old path dep died on every fresh clone — it pointed into a
# submodule nothing initializes (no --recurse-submodules, no doc
# step, no provision door); the pinned git fetch needs none of that.
# Same tree as the vendored submodule (the walls pin that equality).
melite-model-base = { git = "https://github.com/JayDataEngineer/melite-model-base.git", rev = "8444fe5dd9b57e75ec24902158b31858d3fa3b6d" }
# kimodo's motion lib (Apache-2.0, NVIDIA's correct_motion standalone
# tree): the PyPI 0.2.2 pins a dead stack (scikit-image==0.21 +
# matplotlib==3.7.2 + astropy==6.0.0 — none ship cp312 wheels), so a
# --frozen sync built them from source and died under Cython 3 on
# every fresh machine; the 1.0.0 we run is torch+numpy only (CMake
# C++ ext — cmake + g++ are provisioning prerequisites). 2026-10-15:
# the vendor path is GONE (it blocked every fresh clone — the dir
# never shipped) and the published pin replaces it: the same 1.0.0
# tree, fetched at a frozen rev by the lock (the extensions law for
# pip-level Layer C: a ref-pinned repo, never a floating clone).
motion-correction = { git = "https://github.com/JayDataEngineer/MotionCorrection.git", rev = "7a070f740eea9e1a35c11007cd1230e7a5bdc91c" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

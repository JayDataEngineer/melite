# Git hooks (lefthook, DSH shape). Local checkpoints stay FAST; the
# walls + CI own the full gate matrix. Install: automatic — the root
# postinstall (tools/install-lefthook.mjs) runs `lefthook install` on
# every `pnpm install`; CI and user-owned core.hooksPath skip it.

pre-commit:
  jobs:
    # THE BOUNDARY LINT (schema-gate-inventory fix 5, 2026-10-12):
    # `pnpm run lint` (tools/arch-lint.ts) was declared but wired
    # into nothing — a gate that cannot fire is the same defect
    # class as a self-skipping wall. It reads source files and
    # regexes imports (~2s, executes nothing, no network), so it
    # carries no explicit glob — lefthook's default staged-file
    # template fires it on every commit that stages anything.
    - name: arch-lint (estate boundaries)
      run: node tools/arch-lint.ts --quiet

    # THE UNIT PLANE IS THE GATE (walls' successor, 2026-09-11 — the
    # run.mjs orchestrator died with the vitest migration): any staged
    # change that can move a wall (estate TS or the suites themselves)
    # re-runs the node project that owns tests/walls/ts/suites.
    # NO GLOB (R4-10, 2026-10-13): the glob was '*.{ts,tsx,mjs}',
    # so a commit staging only .json/.yaml/.md skipped the walls —
    # while the walls judge data/model-facts.json, models/*/nodes.yaml
    # and pnpm-workspace.yaml. An enumerated extension list is the
    # same rot class it cures; like arch-lint above, the job fires on
    # every commit that stages anything.
    - name: walls (staged anything)
      # Direct node invocation (2026-09-11): pnpm exec re-verifies
      # deps before every run and the tree's unapproved
      # @parcel/watcher build script fails that check; the root
      # vitest binary runs the same gate.
      #
      # THE SIGPIPE FIX (2026-10-10): the full fleet's ~128s of
      # output through lefthook's capture pipe killed the job AFTER
      # a fully-green summary (node writes the last line into a
      # closed pipe, dies 141, lefthook reads ✗ — three commits
      # bounced on it while the same command exited 0 bare). The
      # fleet writes to a FILE; the verdict rides the last lines and
      # vitest's own exit code.
      # THE LANE-ENV SCRUB (li-bp, 2026-09-29): the battery's own law —
      # a shell that drove the 3088 lane carries MELITE_AGENT_ROUTE (and
      # possibly a present-but-empty MELITE_MCP_ENGINES), and the walls
      # judge the DEFAULTS: commission.spec expects the zai/glm-5.3
      # brain default and estate.spec expects the mcp row's own config,
      # so an ambient route/engines var flips two walls red on a green
      # tree. The hook scrubs both exactly as `pnpm run test` does.
      # THE /tmp JANITOR FIX (2026-10-12): this box's /tmp is swept
      # by an aggressive janitor while the fleet runs — the log file
      # vanished between redirect and tail twice (tail ENOENT, exit 1,
      # a green tree bounced), and vite's ssr transform cache under
      # /tmp died the same death mid-fleet (293 suites ENOENT on
      # `await import` in one hook run while the bare command exited
      # 0 minutes earlier). The log AND the run's temp tree ride a
      # mktemp -d under /var/tmp, which the janitor never touches (a
      # buildah dir from May survives there) and whose tmpfiles age
      # policy (30d) cannot age out files minted this run. Never
      # point this INSIDE the repo: Node's nearest-package.json rule
      # makes the commission-supervisor stub's CommonJS `require`
      # die under the repo's "type": "module" reach — verified
      # deterministically before choosing /var/tmp.
      # PER-RUN (2026-10-13, the flake audit): the dir was FIXED, so two
      # hook runs shared one TMPDIR and one log path — each teardown
      # sweep could rm -rf the other's LIVE trees through the 1s mtime
      # fence, and the log's `>` truncate made the loser tail the
      # winner's verdict. mktemp -d per run removes both hazards, and
      # the tree goes with the run.
      # KEEP the log on failure (2026-10-13): a flake bounced the
      # walls job and the unconditional rm ate the only evidence —
      # green runs sweep themselves, red runs leave the log for the
      # name (the janitor-safe .scratch dir under repo root).
      # mkdir -p before the redirect (2026-10-13): a fresh clone has
      # no .scratch, and a redirect into a missing dir kills the
      # compound before vitest starts — the hook refused having
      # judged nothing.
      run: d=$(mktemp -d /var/tmp/melite-hook-XXXXXX) && mkdir -p .scratch && env -u MELITE_MCP_ENGINES -u MELITE_AGENT_ROUTE TMPDIR=$d node node_modules/vitest/vitest.mjs run --project node > .scratch/hook-walls.$$.log 2>&1; code=$?; tail -n 4 .scratch/hook-walls.$$.log; if [ $code -ne 0 ]; then echo "walls log kept at .scratch/hook-walls.$$"; mv .scratch/hook-walls.$$.log .scratch/hook-walls.$$.kept.log; rm -rf "$d"; exit $code; fi; rm -rf "$d" .scratch/hook-walls.$$.log; exit $code

    - name: final-newline (staged text)
      run: node tools/hook-final-newline.mjs {staged_files}

pre-push:
  jobs:
    # The full local battery on push: tsc per typecheck package
    # (CI runs unit/coverage/tiers only — types are the battery's
    # to own) + the walls via the root vitest node project.
    #
    # THE UPSTREAM-TRACKING LAW (found 2026-10-13): lefthook
    # computes a pre-push job's file set from the current branch's
    # @{push}; a branch with NO upstream tracking yields an empty
    # set and the job silently skips ("no matching push files") —
    # batches pushed with the type battery never firing. The
    # one-time cure is `git push -u origin cordis`; a checkout that
    # moves to a fresh branch must re-track before trusting a push.
    # The typecheck-gate wall owns this truth on every root test
    # run regardless (typecheck-gate.spec.ts), so the battery is
    # the second seat, never the only one.
    - name: tsc + walls (full)
      run: node tools/hook-full-battery.mjs

    # THE PROFANITY GATE (owed-fixes round, 2026-11-05, operator order):
    # every kind of profanity, judged at push and at publish, riding
    # MAINTAINED lists (leo-profanity + naughty-words — never a
    # hand-rolled word list). Two phases, ONE tool run, one exit code:
    #
    # PHASE 1 (live): the authored faces WHOLESALE (packages scripts
    # tools lefthook.yml) — a SUPERSET of the pushed set, so the job
    # carries no {push_files} template at all. Reason (verified on
    # lefthook 2.1.12, 2026-11-05): when lefthook computes an EMPTY
    # push set (the UPSTREAM-TRACKING LAW above — a fresh branch's
    # first push) it skips EVERY pre-push job, with template or not
    # ("no matching push files"), so no template shape can widen
    # coverage; the wholesale face is the widest shape that survives.
    # The residual gap (all pre-push jobs skipped on a no-upstream
    # push) is the same one the battery job carries — the wall suite
    # (profanity-gate.spec.ts) and the history baseline are the
    # backstops, the battery's own "second seat" doctrine.
    #
    # PHASE 2 (range): --history @{push}..HEAD judges every commit the
    # push would add IN ITS OWN TREE (git ls-tree + cat-file --batch,
    # streamed, never a checkout) — commit A adds profanity, commit B
    # removes it, the clean tip must not smuggle the blob into
    # history. NO UPSTREAM: the tool skips the range phase LOUDLY (one
    # log line), never silently — the live faces above still fired.
    - name: profanity (authored faces + push range)
      # THE SIGPIPE-CLASS LOG PATTERN (the walls job's cure, mirrored):
      # a dirty range prints one line per hit (1000+ lines on a real
      # history catch) — through lefthook's capture pipe that is the
      # SIGPIPE wedge class, where a green verdict can die after the
      # summary. The gate writes to a file; the verdict rides the tail
      # and the exit code. RED KEEPS the full hit list at
      # .scratch/hook-profanity.$$ (the evidence the operator rules
      # on); green sweeps it. mkdir first — a fresh clone has no
      # .scratch (the GT-02 lesson).
      run: mkdir -p .scratch && node tools/profanity-gate.mjs packages scripts tools lefthook.yml --history '@{push}..HEAD' > .scratch/hook-profanity.$$.log 2>&1; code=$?; tail -n 20 .scratch/hook-profanity.$$.log; if [ $code -ne 0 ]; then echo "profanity log kept at .scratch/hook-profanity.$$"; exit $code; fi; rm -f .scratch/hook-profanity.$$.log; exit $code

# Git hooks (lefthook, DSH shape). Local checkpoints stay FAST; the
# walls + CI own the full gate matrix. Install: `pnpm exec lefthook
# install` (or `pnpm install` once a postinstall lands).

pre-commit:
  jobs:
    # THE UNIT PLANE IS THE GATE (walls' successor, 2026-09-11 — the
    # run.mjs orchestrator died with the vitest migration): any staged
    # change that can move a wall (estate TS or the suites themselves)
    # re-runs the node project that owns tests/walls/ts/suites.
    - name: walls (staged TS/walls)
      glob: '*.{ts,tsx,mjs}'
      # Direct node invocation (2026-09-11): pnpm exec re-verifies
      # deps before every run and the tree's unapproved
      # @parcel/watcher build script fails that check; the root
      # vitest binary runs the same gate.
      run: node node_modules/vitest/vitest.mjs run --project node

    - name: final-newline (staged text)
      run: node tools/hook-final-newline.mjs {staged_files}

pre-push:
  jobs:
    # The full local battery on push: tsc per package (the CI
    # matrix's local mirror) + walls again (cheap).
    - name: tsc x5 + walls (full)
      run: node tools/hook-full-battery.mjs
